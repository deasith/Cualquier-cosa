<title>Corona Estelar</title>
<meta name="description" content="Shooter táctico top-down de guerra galáctica: mueve a tu Vindicado, elige base y armas, enfréntate a enjambres, brutos y jefes de la Plaga en un frente compartido." />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap');
  :root{
    --void:#0d0a0b; --panel:#16110f; --panel-2:#1e1714; --line:#3a2c22; --line-soft:#2a2019;
    --gold:#c9a24b; --gold-dim:#8f7233; --crimson:#b3312b; --crimson-lit:#e0554a;
    --plague:#4fd6b8; --plague-dim:#2f8f79; --parch:#e8dcc4; --parch-dim:#b6a888; --ash:#7c6f5e;
    --ok:#7fb069; --warn:#d99a2b; --bad:#cf4b3f;
    --mono:'Share Tech Mono',ui-monospace,monospace; --serif:'Spectral',Georgia,serif; --display:'Cinzel',serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--void);color:var(--parch);font-family:var(--serif);line-height:1.6;-webkit-font-smoothing:antialiased}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45}
  .app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 18px 90px}
  a{color:var(--gold)}
  h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.02em}
  .mono{font-family:var(--mono)}
  .label{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--ash)}
  .gold{color:var(--gold)}.crimson{color:var(--crimson-lit)}.plague{color:var(--plague)}.dim{color:var(--ash)}

  header.top{padding:24px 0 12px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .sigil{width:44px;height:44px;flex:none}
  .brand h1{font-size:clamp(22px,4vw,32px);font-weight:900;color:var(--gold);line-height:1}
  .brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--gold-dim);text-transform:uppercase;margin-top:4px}
  .oath{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ash);max-width:230px;text-align:right}

  nav.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:18px;border:1px solid var(--line);background:#0b0807}
  nav.tabs button{flex:1 1 auto;background:transparent;border:0;border-right:1px solid var(--line-soft);color:var(--parch-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;padding:11px 8px;cursor:pointer;transition:.15s;position:relative;white-space:nowrap}
  nav.tabs button:last-child{border-right:0}
  nav.tabs button:hover{color:var(--parch);background:#120d0b}
  nav.tabs button[aria-current="true"]{color:var(--gold);background:linear-gradient(180deg,#1b1310,#120d0b)}
  nav.tabs button[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold)}
  nav.tabs button:disabled{opacity:.32;cursor:not-allowed}

  .hud{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:20px}
  .vitals{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .avatar{width:44px;height:44px;border:1px solid var(--line);background:#0b0807;display:grid;place-items:center;font-size:22px;flex:none}
  .vitals .who .name{font-family:var(--display);font-weight:700;font-size:17px;color:var(--parch)}
  .vitals .who .role{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase}
  .meters{display:flex;gap:16px;flex-wrap:wrap;flex:1;min-width:180px}
  .meter{flex:1;min-width:110px}
  .meter .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ash);margin-bottom:4px}
  .bar{height:8px;background:#0b0807;border:1px solid var(--line-soft);overflow:hidden}
  .bar > i{display:block;height:100%;transition:width .4s ease}
  .bar.hp > i{background:linear-gradient(90deg,var(--crimson),var(--crimson-lit))}
  .bar.moral > i{background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
  .bar.lib > i{background:linear-gradient(90deg,var(--plague-dim),var(--plague))}

  .card{background:linear-gradient(180deg,var(--panel),#120d0b);border:1px solid var(--line);position:relative}
  .card::before{content:"";position:absolute;top:6px;left:6px;right:6px;bottom:6px;border:1px solid var(--line-soft);pointer-events:none;opacity:.5}
  .pad{padding:20px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
  section.view{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:var(--gold-dim);margin-bottom:6px}
  h2.title{font-size:clamp(20px,3.4vw,30px);color:var(--parch);margin-bottom:4px}
  p.lede{color:var(--parch-dim);font-size:15px;max-width:64ch}
  hr.rule{border:0;border-top:1px solid var(--line-soft);margin:22px 0}

  .btn{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;background:#0b0807;color:var(--parch);border:1px solid var(--line);padding:12px 16px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--gold-dim);color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim) inset}
  .btn.primary{background:linear-gradient(180deg,#3a2c14,#241a0d);border-color:var(--gold-dim);color:var(--gold)}
  .btn.primary:hover{box-shadow:0 0 18px -6px var(--gold)}
  .btn.danger:hover{border-color:var(--crimson);color:var(--crimson-lit);box-shadow:0 0 0 1px var(--crimson) inset}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}

  .opt{border:1px solid var(--line);background:var(--panel);padding:14px 15px;cursor:pointer;transition:.15s;position:relative}
  .opt:hover{border-color:var(--gold-dim);background:var(--panel-2)}
  .opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 24px -12px var(--gold)}
  .opt[aria-pressed="true"]::after{content:"◆";position:absolute;top:10px;right:12px;color:var(--gold);font-size:12px}
  .opt .nm{font-family:var(--display);font-weight:700;font-size:16px;color:var(--parch);display:flex;align-items:center;gap:8px}
  .opt .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ash);text-transform:uppercase}
  .opt .desc{font-size:13.5px;color:var(--parch-dim);margin-top:5px}
  .opt .stats{font-family:var(--mono);font-size:11.5px;color:var(--gold-dim);margin-top:7px;letter-spacing:.03em}

  input.field{width:100%;background:#0b0807;border:1px solid var(--line);color:var(--parch);font-family:var(--mono);font-size:15px;padding:12px 14px;letter-spacing:.04em}
  input.field:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 1px var(--gold-dim) inset}

  .sectors{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .sector{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#0e0a09);padding:14px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .sector:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
  .sector .nm{font-family:var(--display);font-weight:700;font-size:15px}
  .sector .co{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase}
  .sector .thr{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;margin:8px 0 6px}
  .sector.lost{opacity:.72;filter:saturate(.5)}
  .sector.lost::after{content:"CAÍDO";position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--crimson-lit)}
  .sector.liber::after{content:"LIBERADO";position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--plague)}
  .ctlbar{height:6px;background:#2a1210;border:1px solid var(--line-soft);overflow:hidden}
  .ctlbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;border:1px solid var(--line);padding:5px 10px;color:var(--parch-dim)}
  .chip.medal{border-color:var(--gold-dim);color:var(--gold)}
  .chip.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}

  .squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .trooper{border:1px solid var(--line-soft);background:#0b0807;padding:10px 12px}
  .trooper .tn{font-family:var(--display);font-size:14px;font-weight:700}
  .trooper .tr{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ash);text-transform:uppercase}
  .trooper.dead{opacity:.5}.trooper.dead .tn{text-decoration:line-through;color:var(--crimson-lit)}
  .trooper .thp{height:5px;background:#2a1210;margin-top:7px;border:1px solid var(--line-soft)}
  .trooper .thp > i{display:block;height:100%;background:var(--crimson-lit)}

  .ticker{border:1px solid var(--line);background:#0b0807;overflow:hidden;white-space:nowrap;margin-bottom:16px}
  .ticker .run{display:inline-block;padding:9px 0;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--gold);animation:scroll 34s linear infinite}
  .ticker .run span{margin:0 26px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .bulletin{border-bottom:1px solid var(--line-soft);padding:14px 0;display:grid;gap:5px}
  .bulletin .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase;display:flex;gap:12px}
  .bulletin .hl{font-family:var(--display);font-weight:700;font-size:16px;color:var(--parch)}
  .bulletin .bd{font-size:14px;color:var(--parch-dim)}
  .bulletin.war .hl{color:var(--crimson-lit)} .bulletin.win .hl{color:var(--plague)}

  .center{text-align:center}
  .muted-box{border:1px dashed var(--line);padding:22px;text-align:center;color:var(--ash);font-family:var(--mono);font-size:13px;letter-spacing:.05em}
  footer.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ash);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  /* ============ ARENA ============ */
  .arena-wrap{position:relative;border:1px solid var(--line);background:#080606;overflow:hidden;touch-action:none;user-select:none}
  #game{display:block;width:100%;height:auto}
  .hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;gap:10px}
  .hud-box{background:rgba(8,6,6,.72);border:1px solid var(--line-soft);padding:7px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--parch-dim);backdrop-filter:blur(2px)}
  .hud-box b{color:var(--parch)}
  .hp-strip{height:9px;width:190px;max-width:38vw;background:#2a1210;border:1px solid var(--line-soft);margin-top:5px;overflow:hidden}
  .hp-strip > i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),var(--crimson-lit));transition:width .12s}
  .boss-strip{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(560px,84%);pointer-events:none;text-align:center}
  .boss-strip .bn{font-family:var(--display);font-weight:700;color:var(--crimson-lit);letter-spacing:.1em;font-size:14px;text-shadow:0 0 10px #000}
  .boss-strip .bb{height:12px;background:#1a0c0b;border:1px solid var(--crimson);margin-top:4px;overflow:hidden}
  .boss-strip .bb > i{display:block;height:100%;background:linear-gradient(90deg,#5a1512,var(--crimson),var(--plague));transition:width .15s}
  .hud-bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 12px;pointer-events:none;gap:10px}
  .weapon-box{background:rgba(8,6,6,.72);border:1px solid var(--line-soft);padding:8px 12px;font-family:var(--mono)}
  .weapon-box .wn{color:var(--gold);font-size:13px;letter-spacing:.06em}
  .weapon-box .wa{color:var(--parch-dim);font-size:12px;margin-top:2px}
  .weapon-box .wa.reloading{color:var(--warn)}
  .keys-hint{font-family:var(--mono);font-size:10.5px;color:var(--ash);letter-spacing:.05em;text-align:right;line-height:1.7}
  .arena-toast{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-size:clamp(22px,5vw,40px);letter-spacing:.06em;color:var(--gold);text-shadow:0 0 24px #000,0 0 8px var(--gold-dim);pointer-events:none;opacity:0;text-align:center}
  .arena-toast.show{animation:toast 2.1s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
  .over{position:absolute;inset:0;background:rgba(6,4,4,.9);display:grid;place-items:center;text-align:center;padding:24px;z-index:5}
  .over h2{font-size:clamp(26px,6vw,44px);letter-spacing:.05em}
  .over.defeat h2{color:var(--crimson-lit)} .over.victory h2{color:var(--gold)}
  .over p{color:var(--parch-dim);font-size:15px;margin:14px auto 22px;max-width:44ch}
  .pausebtn{pointer-events:auto}
  /* touch controls */
  .touch-only{display:none}
  @media (pointer:coarse){ .touch-only{display:block} .desktop-only{display:none} }
  .joy{position:absolute;bottom:16px;left:16px;width:120px;height:120px;border:1px solid var(--line-soft);border-radius:50%;background:rgba(20,14,12,.4);pointer-events:auto;z-index:4}
  .joy .stick{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(201,162,75,.35);border:1px solid var(--gold-dim);left:34px;top:34px}
  .fire{position:absolute;bottom:22px;right:20px;width:96px;height:96px;border-radius:50%;border:1px solid var(--crimson);background:rgba(120,20,18,.35);color:var(--parch);font-family:var(--mono);font-size:12px;letter-spacing:.1em;pointer-events:auto;z-index:4}
  .swapbtn{position:absolute;bottom:130px;right:34px;width:64px;height:64px;border-radius:50%;border:1px solid var(--gold-dim);background:rgba(40,30,14,.4);color:var(--gold);font-family:var(--mono);font-size:11px;pointer-events:auto;z-index:4}

  /* ============ LOBBY / PUENTE ============ */
  .hub-wrap{position:relative;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 0%,#141a22 0%,#0a0b0f 55%,#080606 100%);overflow:hidden;touch-action:none;user-select:none;box-shadow:inset 0 0 120px rgba(0,0,0,.6)}
  #hub{display:block;width:100%;height:auto}
  .hub-banner{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;pointer-events:none;gap:10px}
  .hub-name{font-family:var(--display);font-weight:900;font-size:clamp(15px,2.4vw,20px);color:var(--gold);letter-spacing:.06em;text-shadow:0 0 16px #000}
  .hub-name small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--gold-dim);font-weight:400;margin-top:2px}
  .hub-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ash);pointer-events:none;text-shadow:0 0 8px #000}
  .prompt{position:absolute;transform:translate(-50%,-100%);background:rgba(8,6,6,.9);border:1px solid var(--gold-dim);padding:6px 12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--gold);white-space:nowrap;pointer-events:none;box-shadow:0 0 18px -6px var(--gold);opacity:0;transition:opacity .12s}
  .prompt.show{opacity:1}
  .prompt b{color:var(--parch)}

  /* NPC dialogue modal */
  .dialog{position:absolute;inset:0;background:rgba(6,5,7,.82);display:grid;place-items:end center;padding:0 0 4%;z-index:6;animation:fade .2s}
  .dialog .box{width:min(680px,92%);background:linear-gradient(180deg,#161018,#0c0910);border:1px solid var(--line);padding:0;box-shadow:0 20px 60px -20px #000}
  .dialog .top{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(201,162,75,.06),transparent)}
  .dialog .who .nm{font-family:var(--display);font-weight:700;font-size:18px;color:var(--parch)}
  .dialog .who .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim);margin-top:2px}
  .dialog .line{padding:18px;font-family:var(--serif);font-size:16px;font-style:italic;color:var(--parch);line-height:1.6}
  .dialog .line::before{content:"“";color:var(--gold-dim);font-size:22px;margin-right:2px}
  .dialog .acts{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 18px}
  .portrait{width:60px;height:60px;flex:none;border:1px solid var(--line);background:#0b0807;border-radius:2px}

  /* Estims HUD */
  .stim-tray{display:flex;gap:6px;background:rgba(8,6,6,.72);border:1px solid var(--line-soft);padding:6px 8px}
  .stim-pip{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);min-width:30px}
  .stim-pip .ic{font-size:15px;line-height:1}
  .stim-pip .cg{font-size:10px;color:var(--parch-dim)}
  .stim-pip .kb{font-size:8.5px;color:var(--ash);letter-spacing:.04em}
  .stim-pip.empty{opacity:.32}
  .reinf-box{background:rgba(8,6,6,.72);border:1px solid var(--line-soft);padding:6px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--parch-dim);text-align:center}
  .reinf-box b{color:var(--gold)} .reinf-box.ready b{color:var(--plague)}
  .hud-mid{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end;pointer-events:none;flex-wrap:wrap;justify-content:center;max-width:96%}

  /* Radio feed */
  .radio{position:absolute;left:12px;top:96px;bottom:auto;width:min(290px,46%);display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:2}
  .radio .msg{font-family:var(--mono);font-size:11px;letter-spacing:.02em;background:rgba(8,6,6,.7);border-left:2px solid var(--gold-dim);padding:4px 8px;color:var(--parch-dim);animation:fade .2s}
  .radio .msg b{font-weight:400}

  .stimbtn{position:absolute;bottom:130px;right:110px;width:60px;height:60px;border-radius:50%;border:1px solid var(--ok);background:rgba(30,60,30,.4);color:var(--ok);font-family:var(--mono);font-size:11px;pointer-events:auto;z-index:4}
  .reinfbtn{position:absolute;bottom:200px;right:34px;width:60px;height:60px;border-radius:50%;border:1px solid var(--plague-dim);background:rgba(20,50,44,.4);color:var(--plague);font-family:var(--mono);font-size:10px;pointer-events:auto;z-index:4}
  .stratbtn{position:absolute;bottom:200px;right:110px;width:60px;height:60px;border-radius:50%;border:1px solid var(--gold-dim);background:rgba(40,30,14,.4);color:var(--gold);font-family:var(--mono);font-size:10px;pointer-events:auto;z-index:4}

  /* ============ MAPA GALÁCTICO ============ */
  .galaxy-wrap{position:relative;border:1px solid var(--line);background:radial-gradient(120% 100% at 50% 46%,#0a1018 0%,#070a10 45%,#050406 100%);overflow:hidden;touch-action:none;user-select:none}
  #galaxy{display:block;width:100%;height:auto;cursor:crosshair}
  .gx-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;pointer-events:none;gap:10px}
  .gx-title{font-family:var(--display);font-weight:900;font-size:clamp(15px,2.4vw,20px);color:var(--gold);letter-spacing:.06em;text-shadow:0 0 16px #000}
  .gx-title small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--gold-dim);font-weight:400;margin-top:2px}
  .gx-legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:flex-end;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--parch-dim)}
  .gx-legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border-radius:2px}

function mkSector(p,i){
  const ctl = i<3? rr(52,84) : i<8? rr(26,58) : rr(8,40);
  const res = p.fac==="legion"? rr(34,62) : p.fac==="coro"? rr(38,66) : rr(16,46);
  const s={id:p.id, nm:p.nm, co:p.co, fac:p.fac, ctl:Math.round(ctl), resistance:Math.round(res), status:"activo", threat:"media"};
  updateSectorStatus(s); return s;
}
function freshWar(){
  const sectors=PLANETS.map(mkSector);
  const w={ sectors, plaga:46, missions:0, fallen:[], liberated:0, liberationPct:50 };
  return w;
}
/* Migración: añade planetas nuevos y campos que falten a partidas antiguas */
function syncGame(){
  if(!GAME.war) GAME.war=freshWar();
  const w=GAME.war; if(!Array.isArray(w.sectors))w.sectors=[];
  const have=new Set(w.sectors.map(s=>s.id));
  PLANETS.forEach((p,i)=>{ if(!have.has(p.id)) w.sectors.push(mkSector(p,i)); });
  for(const s of w.sectors){ const p=PLANET_BY_ID[s.id]; if(p){ s.nm=p.nm; s.co=p.co; if(!s.fac)s.fac=p.fac; } if(s.resistance===undefined)s.resistance= s.fac==="plaga"?30:45; updateSectorStatus(s); }
  if(GAME.req===undefined)GAME.req=0;
  if(GAME.difficulty===undefined||GAME.difficulty<0||GAME.difficulty>4)GAME.difficulty=1;
  if(GAME.character)ensureRPG(GAME.character);
  if(!Array.isArray(GAME.unlocked))GAME.unlocked=["torreta"];
  if(!GAME.unlocked.includes("torreta"))GAME.unlocked.unshift("torreta");
  if(!Array.isArray(GAME.equip)||!GAME.equip.length)GAME.equip=["torreta"];
  GAME.equip=GAME.equip.filter(k=>GAME.unlocked.includes(k)).slice(0,4);
  recomputeLiberation();
}

function rankInfo(g){ g=g||0; let i=0; for(let k=0;k<RANKS.length;k++){ if(g>=RANKS[k][0])i=k; } const cur=RANKS[i], nxt=RANKS[i+1]||null;
  const base=cur[0], top=nxt?nxt[0]:base; const prog=nxt?Math.max(0,Math.min(1,(g-base)/(top-base))):1;
  return {idx:i, name:cur[1], ico:cur[2]||"○", next:nxt?nxt[1]:null, need:nxt?top-g:0, prog}; }

const ATTRS=[["fue","Fuerza","+% daño"],["des","Destreza","+% velocidad"],["con","Constitución","+ Vida"],["vol","Voluntad","+ recarga y estims"],["pun","Puntería","+ crítico y precisión"]];
const BASE_ATTR={

  marcado:{fue:11,des:12,con:12,vol:11,pun:12},
  automata:{fue:12,des:10,con:12,vol:14,pun:11},
};
function amod(s){ return Math.floor(((s==null?10:s)-10)/2); }
const SENDAS={
  vanguardia:{nm:"Vanguardia", ico:"⚔", col:"#e0554a", desc:"+15% de daño y +10% de velocidad. Siempre al frente."},
  francotirador:{nm:"Francotirador", ico:"✧", col:"#c9a24b", desc:"+20% de prob. de crítico y mucha más precisión."},
  medico:{nm:"Médico de Campaña", ico:"✚", col:"#7fb069", desc:"Tus estims curan +60% y llevas una carga extra de cada uno."},
  zapador:{nm:"Zapador", ico:"✷", col:"#4fd6b8", desc:"Enfriamiento de estratagemas −30% y +25% de daño explosivo."},
  berserker:{nm:"Berserker", ico:"☲", col:"#b3312b", desc:"Cuanta menos Vida te queda, más daño haces (hasta +45%)."},
  guardian:{nm:"Guardián", ico:"⛨", col:"#8a6bd6", desc:"−22% de daño recibido y +20 de Vida máxima."},
};
const SENDA_LVL=3;
function xpNext(level){ return 60 + level*45; }
function ensureRPG(c){ if(!c)return; if(c.level==null)c.level=1; if(c.xp==null)c.xp=0; if(c.points==null)c.points=0; if(c.senda===undefined)c.senda=null;
  if(!c.attrs) c.attrs={...(BASE_ATTR[c.base]||BASE_ATTR.centinela)};
  for(const a of ["fue","des","con","vol","pun"]) if(c.attrs[a]==null)c.attrs[a]=10; }
function gainXP(c,amount){ c.xp+=amount; let lv=0; while(c.xp>=xpNext(c.level)){ c.xp-=xpNext(c.level); c.level++; c.points+=2; lv++; } return lv; }
function rpgDerived(c){ ensureRPG(c); const A=c.attrs,b=BASES[c.base],S=c.senda;
  let dmg=b.dmgMult*(1+amod(A.fue)*0.06); if(S==="vanguardia")dmg*=1.15;
  let hp=b.hp+amod(A.con)*8+(S==="guardian"?20:0);
  let speed=b.speed*(1+amod(A.des)*0.04)*(S==="vanguardia"?1.1:1);
  let reload=Math.max(.55,1-amod(A.vol)*0.04);
  let crit=Math.max(0,Math.min(.6,0.05+amod(A.pun)*0.03))+(S==="francotirador"?0.2:0);
  return {dmg:Math.round(dmg*100),hp,speed:Math.round(speed/10),reload:Math.round(reload*100),crit:Math.round(crit*100)}; }
function spendAttr(k){ const c=GAME.character; if(!c||c.points<=0)return; ensureRPG(c); if(c.attrs[k]==null)c.attrs[k]=10; if(c.attrs[k]>=20)return; c.attrs[k]++; c.points--; save(); render(); }
function chooseSenda(k){ const c=GAME.character; if(!c||c.senda||!SENDAS[k]||c.level<SENDA_LVL)return; c.senda=k; GAME.news.unshift({kind:"decree",src:"REGISTRO DEL TRONO",time:`CICLO ${GAME.war.missions}`,hl:`${c.name} jura la senda de ${SENDAS[k].nm}`,bd:SENDAS[k].desc}); save(); render(); }

function pickBase(k){ pickState.base=k; if(!pickState.secondary){ const alt=Object.keys(WEAPONS).find(w=>w!==BASES[k].primary); pickState.secondary=alt; } render(); }
function commitCharacter(){
  GAME.character=finalizeCharacter(pickState.base,pickState.name,pickState.secondary);

  recomputeLiberation();
  GAME.news.unshift({kind:"decree",src:"REGISTRO DE ALISTAMIENTO",time:`CICLO ${GAME.war.missions}`,hl:`${GAME.character.name} toma el mando`,bd:`Un ${BASES[GAME.character.base].nm} sube a bordo de La Supertierra. Que la Corona guíe su mano.`});

function unlockStrat(k){ const d=STRATAGEMS[k]; if(!d||(GAME.unlocked||[]).includes(k))return; if((GAME.req||0)<d.cost)return; GAME.req-=d.cost; GAME.unlocked.push(k); if((GAME.equip||[]).length<4)GAME.equip.push(k); save(); render(); }
function toggleEquip(k){ if(!(GAME.unlocked||[]).includes(k))return; const i=GAME.equip.indexOf(k); if(i>=0)GAME.equip.splice(i,1); else { if(GAME.equip.length>=4)return; GAME.equip.push(k); } save(); render(); }

/* ---------- Navegación ---------- */
function stopCanvases(){ if(typeof Hub!=="undefined")Hub.stop(); if(typeof Galaxy!=="undefined")Galaxy.stop(); }
function enterHub(){ if(!GAME.character){ go("roster"); return; } if(typeof Arena!=="undefined")Arena.stop(); if(typeof Galaxy!=="undefined")Galaxy.stop(); GAME.screen="hub"; save(); Hub.mount(); }
function go(tab){
  stopCanvases();
  if(tab==="hub"){ enterHub(); return; }
  if(tab==="roster"){ pickState={base:null,name:"",secondary:null}; GAME.screen="roster"; save(); render(); return; }
  if(tab==="intro"){ GAME.screen="intro"; render(); return; }
  if(tab==="frente" && GAME.character){ GAME.tab="frente"; GAME.screen="galaxy"; save(); Galaxy.mount(); return; }
  GAME.tab=tab;
  if(GAME.character) GAME.screen="game"; else GAME.screen=(tab==="armeria"||tab==="bestiario"||tab==="estratagemas")?"codex":"intro";
  save(); render();
}
function bodyForTab(){
  if(!GAME.character){ if(GAME.tab==="armeria")return viewArmeria(); if(GAME.tab==="bestiario")return viewBestiario(); if(GAME.tab==="estratagemas")return viewEstratagemas(); return viewIntro(); }
  switch(GAME.tab){case"frente":return viewFrente();case"personaje":return viewPersonaje();case"armeria":return viewArmeria();case"estratagemas":return viewEstratagemas();case"bestiario":return viewBestiario();case"noticias":return viewNoticias();default:return viewFrente();}
}
function shell(inner,noHud){return header()+tabs()+((GAME.character&&!noHud)?hud():'')+inner+`<footer class="foot"><span>CORONA ESTELAR · EL FRENTE ETERNO</span><span>Ciclo ${GAME.war.missions} · Plaga ${GAME.war.plaga}% · Caídos ${GAME.war.fallen.length}</span></footer>`;}

function render(){
  if(GAME.screen==="arena"||GAME.screen==="hub"||GAME.screen==="galaxy") return; // se dibujan en canvas, no re-renderizan el DOM
  let inner;
  switch(GAME.screen){
    case"intro": inner=shell(GAME.tab==="armeria"?viewArmeria():GAME.tab==="bestiario"?viewBestiario():viewIntro()); break;
    case"roster": inner=header()+tabs()+viewRoster(); break;
    case"briefing": inner=shell(viewBriefing()); break;
    case"codex": inner=shell(bodyForTab()); break;
    case"game": default: inner=shell(bodyForTab()); break;
  }
  app.innerHTML=inner;
}

/* ---------- Deriva de guerra / recompensas ---------- */
function recomputeLiberation(){const w=GAME.war; w.liberated=w.sectors.filter(s=>s.status==="liberado").length; w.liberationPct=Math.round(w.sectors.reduce((a,s)=>a+s.ctl,0)/w.sectors.length);}
function updateSectorStatus(s){ if(s.ctl>=100)s.status="liberado"; else if(s.ctl<=0)s.status="caído"; else s.status="activo"; s.threat=s.ctl>70?"baja":s.ctl>45?"media":s.ctl>25?"alta":"crítica"; }
function awardMedals(){const c=GAME.character,has=n=>c.medals.includes(n);
  if(c.missionsDone>=1&&!has("Primera Sangre"))c.medals.push("Primera Sangre");
  if(c.bosses>=1&&!has("Matarreinas"))c.medals.push("Matarreinas");
  if(c.missionsDone>=5&&!has("Veterano del Frente"))c.medals.push("Veterano del Frente");
  if(c.glory>=26&&!has("Corona de Hierro"))c.medals.push("Corona de Hierro");}
const DECREES=["La duda es la primera espora de la Plaga.","El Trono no cuenta a sus caídos. Cuenta a sus héroes.","Ni un paso atrás. Nunca.","Cada bota en el barro sostiene la Corona."];

/* Contraataque de facciones: los planetas pueden ser reclamados entre misiones */
function galaxyTick(){
  const w=GAME.war;
  for(const s of w.sectors){
    if(s.status==="liberado" || s.ctl>62){ if(Math.random()<.5){ s.ctl=clamp(s.ctl-Math.round((s.resistance||30)/100*rr(1,4))); updateSectorStatus(s); } }
    else if(Math.random()<.3){ s.ctl=clamp(s.ctl-rr(0,2)); updateSectorStatus(s); }
  }
  if(Math.random()<.55){
    const cands=w.sectors.filter(s=>s.status!=="caído" && s.ctl>45);
    if(cands.length){ const s=pick(cands), F=facOf(s), hit=Math.round(rr(8,20)*(1+(s.resistance||30)/120));
      const wasLib=s.status==="liberado"; s.ctl=clamp(s.ctl-hit); updateSectorStatus(s);
      GAME.news.unshift({kind:"war",src:`FRENTE · ${s.co}`,time:`CICLO ${w.missions}`,hl:`${F.nm} ${wasLib?"reclama":"contraataca en"} ${s.nm}`,bd:`Una ofensiva de ${F.nm} recupera terreno. Control imperial al ${s.ctl}%. Se necesitan Vindicados en el sector.`});
    }
  }
  recomputeLiberation();
}
function reqReward(mtype, subDone){ let r=18; if(mtype==="defensa")r+=8; if(mtype==="sabotaje")r+=6; if(mtype==="asalto")r+=4; if(subDone)r+=14; return Math.round(r*rr(0.9,1.2)); }

  function spot(i,n,radFrac){ const a=-Math.PI/2 + i/n*6.2832 + rr(-.25,.25); const rad=Math.min(W,H)*radFrac; return {x:clamp(W/2+Math.cos(a)*rad,130,W-130), y:clamp(H/2+Math.sin(a)*rad,130,H-130)}; }

    if(subObj && subObj.key==="muestras" && !subObj.done){ for(const sm of samples){ if(!sm.got && dist(player.x,player.y,sm.x,sm.y)<player.r+18){ sm.got=true; subObj.count++; floatText(sm.x,sm.y-16,"MUESTRA","#4fd6b8"); if(subObj.count>=subObj.total){ subObj.done=true; radio("MANDO","¡Todas las muestras recuperadas! Bonus asegurado.","#4fd6b8"); toast("OBJETIVO EXTRA ✓"); } } } }
    // subobjetivo: destruir depósitos (se cumplen al destruirlos con balas)
    if(subObj && subObj.key==="depositos" && !subObj.done && deposits.length){ const down=deposits.filter(d=>d.hp<=0).length; subObj.count=down; if(down>=subObj.total){ subObj.done=true; radio("MANDO","¡Depósitos destruidos! Bonus asegurado.","#e0554a"); toast("OBJETIVO EXTRA ✓"); } }
    if(missionType==="sabotaje" && terminals){ for(const tm of terminals){ if(tm.active)continue;
      if(dist(player.x,player.y,tm.x,tm.y)<tm.r+player.r+12){ tm.progress+=dt/5; if(tm.progress>=1){ tm.active=true; tm.progress=1; boom(tm.x,tm.y,60,"#8a6bd6"); floatText(tm.x,tm.y-26,"HACKEADA","#8a6bd6"); radio("MANDO","¡Terminal en línea!","#8a6bd6"); } }
      else tm.progress=Math.max(0,tm.progress-dt*.28); } }
    if(missionType==="defensa" && objective){
      if(objective.hit>0)objective.hit-=dt;
      missionTimer-=dt;
      if(objective.hp<=0){ objective.hp=0; return defeat("El Reactor de la Corona cayó ante la Plaga."); }
      if(missionTimer<=22 && !prevBoss){ prevBoss=true; spawnBoss(); radio("MANDO","¡Asalto final! Aguantad hasta la evacuación.","#e0554a"); }
      if(missionTimer<=0){ return victory(); }
    } else if(missionType==="asalto" && nests && nests.length){ if(nests.every(n=>n.hp<=0)) return victory(); }
    else if(missionType==="sabotaje" && terminals && terminals.length){ if(terminals.every(t=>t.active)) return victory(); }
  }
  function fmtTime(s){ s=Math.max(0,s|0); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

  /* ---------- input ---------- */
  function bindInput(){
    window.addEventListener("keydown",onKey); window.addEventListener("keyup",onKeyUp);
    cv.addEventListener("mousemove",onMouse); cv.addEventListener("mousedown",onDown); window.addEventListener("mouseup",onUp);
    cv.addEventListener("contextmenu",e=>e.preventDefault());
  }
  function unbindInput(){
    window.removeEventListener("keydown",onKey); window.removeEventListener("keyup",onKeyUp);
    cv.removeEventListener("mousemove",onMouse); cv.removeEventListener("mousedown",onDown); window.removeEventListener("mouseup",onUp);
  }
  function onKey(e){
    const k=e.key.toLowerCase();
    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
    keys[k]=true;
    if(k==="q") swapWeapon();
    if(k==="r") startReload();
    if(k===" ") tryDash();
    if("1234".includes(k)) useStim(STIM_ORDER[parseInt(k,10)-1]);
    if("5678".includes(k)) useStratagem(parseInt(k,10)-5);
    if(k==="c") callReinforcements();
    if(k==="escape"||k==="p") togglePause();
  }
  function onKeyUp(e){ keys[e.key.toLowerCase()]=false; }
  function onMouse(e){ const rect=cv.getBoundingClientRect(); mouse.x=(e.clientX-rect.left)/rect.width*VW; mouse.y=(e.clientY-rect.top)/rect.height*VH; }
  function onDown(e){ if(e.button===0)mouse.down=true; }
  function onUp(){ mouse.down=false; }

  function swapWeapon(){ if(player.weapons.length<2)return; player.wIdx=(player.wIdx+1)%player.weapons.length; player.fireCd=Math.max(player.fireCd,.15); }
  function startReload(){ const w=player.weapons[player.wIdx],def=WEAPONS[w.key]; if(w.reloading>0||w.ammo>=def.mag)return; w.reloading=def.reload*(player.base==="automata"?.75:1)*(player.reloadMul||1); }
  function tryDash(){ if(player.dashCd>0)return; const dashOK=player.base==="cazador"; player.dashT=.16; player.iframe=.22; player.dashCd=dashOK?.9:1.6; player._dashPow=dashOK?720:520; }
  function togglePause(){ if(state==="playing"){state="paused";} else if(state==="paused"){state="playing";lastT=performance.now();} }

  /* ---------- estims ---------- */
  function useStim(key){
    if(state!=="playing"||!stims||!key) return;
    if(stimGcd>0) return;
    if(!(key in stims) || stims[key]<=0){ toast("SIN "+STIMS[key].nm.toUpperCase()); return; }
    const s=STIMS[key]; stims[key]--; stimGcd=.5;
    if(key==="combate"){ player.hp=Math.min(player.hpMax, player.hp+Math.round(player.hpMax*.4*(player.stimMul||1))); floatText(player.x,player.y-22,"+VIDA",s.col); }
    else { buffs[key]=s.dur*(player.stimMul||1); floatText(player.x,player.y-22,s.nm.split(" ").pop().toUpperCase(),s.col); }
    radio(GAME.character.name, pick(RADIO.stim), GAME.character.col);

  /* ---------- refuerzos SEAF ---------- */

  /* ---------- estratagemas ---------- */
  function useStratagem(idx){
    if(state!=="playing"||!strat) return;
    const st=strat[idx]; if(!st)return; const def=STRATAGEMS[st.key];
    if(st.cd>0){ toast(def.nm.toUpperCase()+` ${Math.ceil(st.cd)}s`); return; }
    if(st.charges<=0){ toast("SIN CARGAS · "+def.nm.toUpperCase()); return; }

  function deployStratagem(key){
    const tx=clamp(player.x+aim.x*300,60,W-60), ty=clamp(player.y+aim.y*300,60,H-60);
    if(key==="torreta"){ const x=clamp(player.x+aim.x*72,30,W-30),y=clamp(player.y+aim.y*72,30,H-30); boom(x,y,30,"#c9a24b"); turrets.push({x,y,life:22,fireCd:.5}); radio("MANDO","Torreta centinela desplegada.","#c9a24b"); toast("TORRETA"); }
    else if(key==="gatling"){ const x=clamp(player.x+aim.x*72,30,W-30),y=clamp(player.y+aim.y*72,30,H-30); boom(x,y,34,"#e8b84b"); turrets.push({x,y,life:16,fireCd:.4,gat:true}); radio("MANDO","Torreta Gatling en línea. ¡A cubierto!","#e8b84b"); toast("TORRETA GATLING"); }
    else if(key==="gas"){ gasClouds.push({x:tx,y:ty,r:96,life:10}); boom(tx,ty,60,"#9bd64f"); radio("MANDO","Gas corrosivo desplegado. No respiréis eso.","#9bd64f"); toast("BOMBARDEO DE GAS"); }
    else if(key==="dron"){ drones.push({x:player.x,y:player.y-30,ang:0,life:18,fireCd:.3}); floatText(player.x,player.y-22,"DRON","#4fd6b8"); radio("MANDO","Dron guardián enlazado a tu señal.","#4fd6b8"); toast("DRON GUARDIÁN"); }
    else if(key==="railcannon"){ let tgt=null; if(bossActive&&boss){tgt=boss;} else { let best=-1; for(const e of enemies){ if(e.hp>0 && e.hp>best){best=e.hp;tgt=e;} } }
      if(tgt){ beams.push({x1:player.x,y1:player.y-8,x2:tgt.x,y2:tgt.y,life:.35}); boom(tgt.x,tgt.y,54,"#7fd0ff"); if(tgt===boss){ damageBoss(560); } else { splashDamage(tgt.x,tgt.y,64,640,1); } radio("MANDO","Cañón de riel: blanco perforado.","#7fd0ff"); toast("CAÑÓN DE RIEL"); }
      else { toast("SIN BLANCO"); } }
    else if(key==="eagle"){ orbitals.push({x:tx,y:ty,t:1.1,big:true}); boom(tx,ty,26,"#ff8c3c"); radio("MANDO","¡Águila-1 en aproximación! Bomba de 500kg soltada.","#ff8c3c"); toast("ÁGUILA 500KG"); }
    else if(key==="resupply"){ for(const w of player.weapons)w.ammo=WEAPONS[w.key].mag; stims.combate=Math.min(9,(stims.combate||0)+1); floatText(player.x,player.y-22,"REABASTECIDO","#7fb069"); radio("MANDO","Cápsula de suministros en tierra.","#7fb069"); toast("REABASTECIMIENTO"); }
    else if(key==="orbital"){ orbitals.push({x:tx,y:ty,t:1.4}); boom(tx,ty,20,"#e0554a"); radio("MANDO","¡Orbital entrante! Despejad la zona.","#e0554a"); toast("BOMBARDEO ORBITAL"); }
    else if(key==="escudo"){ shieldT=6; floatText(player.x,player.y-22,"ESCUDO","#4fd6b8"); radio("MANDO","Búnker de escudo activo.","#4fd6b8"); toast("ESCUDO"); }
    else if(key==="minas"){ for(let i=0;i<7;i++){ const a=rr(0,6.28),d=rr(42,124); mines.push({x:clamp(player.x+Math.cos(a)*d,20,W-20),y:clamp(player.y+Math.sin(a)*d,20,H-20),armT:.6}); } radio("MANDO","Campo de minas sembrado.","#d99a2b"); toast("MINAS"); }
    else if(key==="napalm"){ fires.push({x:tx,y:ty,r:94,life:8}); boom(tx,ty,94,"#ff8c3c"); radio("MANDO","¡Lluvia de fuego!","#ff8c3c"); toast("LLUVIA DE FUEGO"); }
  }
  function turretShoot(t,target){ const spr=t.gat?rr(-.11,.11):rr(-.05,.05); const a=Math.atan2(target.y-t.y,target.x-t.x)+spr; pbullets.push({x:t.x+Math.cos(a)*14,y:t.y+Math.sin(a)*14,vx:Math.cos(a)*840,vy:Math.sin(a)*840,life:.9,r:3,dmg:t.gat?11:16,col:t.gat?"#ffd24b":"#ffe6a3"}); }
  function updateStratagems(dt){
    if(shieldT>0)shieldT-=dt;
    if(strat)for(const st of strat){ if(st.cd>0)st.cd-=dt; }
    // torretas
    if(turrets)for(const t of turrets){ t.life-=dt; t.fireCd-=dt; const tg=nearestEnemy(t.x,t.y,t.gat?620:560); if(tg&&t.fireCd<=0){ turretShoot(t,tg); t.fireCd=t.gat?.09:.28; } }
    if(turrets)turrets=turrets.filter(t=>t.life>0);
    // nubes de gas: DoT + ralentización
    if(gasClouds)for(const g of gasClouds){ g.life-=dt; for(const e of enemies){ if(e.hp>0&&dist(g.x,g.y,e.x,e.y)<g.r+e.r){ e.hp-=22*dt; e.hit=.05; e.slowT=Math.max(e.slowT||0,.4); if(e.hp<=0)killEnemy(e); } } if(bossActive&&boss&&dist(g.x,g.y,boss.x,boss.y)<g.r+boss.r)damageBoss(16*dt); if(nests)for(const n of nests){ if(n.hp>0&&dist(g.x,g.y,n.x,n.y)<g.r+n.r)damageNest(n,16*dt); } }
    if(gasClouds)gasClouds=gasClouds.filter(g=>g.life>0);
    // dron guardián: escolta al jugador y dispara
    if(drones)for(const d of drones){ d.life-=dt; d.fireCd-=dt; d.ang+=dt*1.6; const ox=player.x+Math.cos(d.ang)*46, oy=player.y+Math.sin(d.ang)*46-6; d.x+=(ox-d.x)*Math.min(1,dt*6); d.y+=(oy-d.y)*Math.min(1,dt*6); const tg=nearestEnemy(d.x,d.y,420); if(tg&&d.fireCd<=0){ const a=Math.atan2(tg.y-d.y,tg.x-d.x)+rr(-.04,.04); pbullets.push({x:d.x,y:d.y,vx:Math.cos(a)*900,vy:Math.sin(a)*900,life:.7,r:3,dmg:14,col:"#7fe6d2"}); d.fireCd=.16; } }
    if(drones)drones=drones.filter(d=>d.life>0);
    // rayos del cañón de riel (visual)
    if(beams)for(const bm of beams){ bm.life-=dt; }
    if(beams)beams=beams.filter(bm=>bm.life>0);
    // minas
    if(mines)for(const mn of mines){ if(mn.armT>0){mn.armT-=dt;continue;} let hit=null; for(const e of enemies){ if(e.hp>0&&dist(mn.x,mn.y,e.x,e.y)<26+e.r){hit=e;break;} } if(hit){ mn.dead=true; boom(mn.x,mn.y,80,"#d99a2b"); splashDamage(mn.x,mn.y,88,64,1); } }
    if(mines)mines=mines.filter(m=>!m.dead);
    // fuego
    if(fires)for(const f of fires){ f.life-=dt; for(const e of enemies){ if(e.hp>0&&dist(f.x,f.y,e.x,e.y)<f.r+e.r){ e.hp-=36*dt; e.hit=.05; if(e.hp<=0)killEnemy(e); } } if(bossActive&&boss&&dist(f.x,f.y,boss.x,boss.y)<f.r+boss.r)damageBoss(30*dt); if(nests)for(const n of nests){ if(n.hp>0&&dist(f.x,f.y,n.x,n.y)<f.r+n.r)damageNest(n,26*dt); } }
    if(fires)fires=fires.filter(f=>f.life>0);
    // orbital
    if(orbitals)for(const o of orbitals){ o.t-=dt; if(o.t<=0){ o.dead=true; const R=o.big?250:150, D=o.big?420:200, bd=o.big?520:240; boom(o.x,o.y,R,"#ffb066"); splashDamage(o.x,o.y,R,D,1); if(o.big){shake=Math.max(shake,14);} if(bossActive&&boss&&dist(o.x,o.y,boss.x,boss.y)<R+20)damageBoss(bd); } }
    if(orbitals)orbitals=orbitals.filter(o=>!o.dead);
  }
  /* ---------- radio / mensajes ---------- */
  function radio(who,text,col){ if(!radioMsgs)return; radioMsgs.push({who,text,col:col||"#c9a24b",t:performance.now()}); if(radioMsgs.length>4)radioMsgs.shift(); renderRadio(); }
  function renderRadio(){ if(!radioEl)return; radioEl.innerHTML=radioMsgs.map(m=>`<div class="msg" style="border-color:${m.col}"><b style="color:${m.col}">${esc(m.who)}:</b> ${esc(m.text)}</div>`).join(""); }
  function radioChatter(){
    let cat="banter";
    if(bossActive)cat=Math.random()<.5?"boss":"banter";
    const alive=allies.filter(a=>a.alive);
    if(alive.length && Math.random()<.7){ const spk=pick(alive); radio(spk.name, pick(RADIO[cat]||RADIO.banter), spk.col); }
    else radio("MANDO", pick(RADIO.banter), "#c9a24b");
  }
  function floatText(x,y,txt,col){ if(floats)floats.push({x,y,txt,col:col||"#e8dcc4",life:1.1}); }

  /* ---------- bucle ---------- */
  function loop(t){
    if(!running)return;
    let dt=(t-lastT)/1000; lastT=t; if(dt>.05)dt=.05;
    if(state==="playing") update(dt);
    draw();
    updateHud();
    raf=requestAnimationFrame(loop);
  }

  function moveVec(){
    let x=0,y=0;
    if(keys["w"]||keys["arrowup"])y-=1; if(keys["s"]||keys["arrowdown"])y+=1;
    if(keys["a"]||keys["arrowleft"])x-=1; if(keys["d"]||keys["arrowright"])x+=1;
    if(touchMove.active){ x=touchMove.x; y=touchMove.y; }
    const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;} return{x,y};
  }

  function update(dt){
    const c=GAME.character;
    // ---- jugador ----
    const mv=moveVec();
    let sp=player.speed*(buffs.vigor>0?1.45:1);
    if(player.dashT>0){ player.dashT-=dt; sp=player._dashPow; }
    player.x=clamp(player.x+mv.x*sp*dt,20,W-20); player.y=clamp(player.y+mv.y*sp*dt,20,H-20);
    resolveWalls(player);
    player.fireCd-=dt; player.dashCd-=dt; player.iframe-=dt;
    // temporizadores globales + radio
    if(stimGcd>0)stimGcd-=dt;
    if(reinfCd>0)reinfCd-=dt;
    for(const k in buffs){ if(buffs[k]>0)buffs[k]-=dt; }
    chatterT-=dt; if(chatterT<=0){ radioChatter(); chatterT=rr(9,15); }
    if(player.hp/player.hpMax<.3){ if(!lowWarn){ lowWarn=true; const av=allies.filter(a=>a.alive); radio(av.length?pick(av).name:"MANDO", pick(RADIO.low), "#e0554a"); } }
    else if(player.hp/player.hpMax>.5) lowWarn=false;
    if(radioMsgs.length){ const bN=radioMsgs.length; radioMsgs=radioMsgs.filter(m=>performance.now()-m.t<6500); if(radioMsgs.length!==bN)renderRadio(); }
    // apuntado
    if(touchMove.active||isTouch){ // auto-aim al más cercano
      const tgt=nearestEnemy(player.x,player.y); if(tgt){aim.x=tgt.x-player.x;aim.y=tgt.y-player.y;const m=Math.hypot(aim.x,aim.y)||1;aim.x/=m;aim.y/=m;}
    } else {
      const wx=cam.x+mouse.x, wy=cam.y+mouse.y; aim.x=wx-player.x; aim.y=wy-player.y; const m=Math.hypot(aim.x,aim.y)||1; aim.x/=m; aim.y/=m;
    }
    // recarga
    const w=player.weapons[player.wIdx],def=WEAPONS[w.key];
    if(w.reloading>0){ w.reloading-=dt; if(w.reloading<=0){ w.ammo=def.mag; w.reloading=0; } }
    // disparo
    const firing = mouse.down || touchFire || keys["j"];
    if(firing && player.fireCd<=0 && w.reloading<=0){
      if(w.ammo<=0){ startReload(); }
      else {
        let m=player.dmgMult*(buffs.furia>0?1.4:1);
        if(player.senda==="berserker") m*=1+(1-player.hp/player.hpMax)*0.45;
        const isCrit=Math.random()<(player.crit||0);
        if(isCrit){ m*=2; floatText(player.x+aim.x*24,player.y+aim.y*24-8,"¡CRÍTICO!","#ffe6a3"); }
        fireWeapon(player,def,aim,m,true); w.ammo--; player.fireCd=def.cd*(buffs.furia>0?.7:1); if(w.ammo<=0)startReload();
      }
    }
    // ---- aliados: escuadra (formación inteligente), Vindicados (patrullan) y SEAF ----
    for(const al of allies){ if(!al.alive)continue;
      if(al.seaf){ al.life-=dt; if(al.life<=0){ al.alive=false; boom(al.x,al.y,24,al.col); radio(al.name,"Extracción. Ha sido un honor.",al.col); continue; } }
      al.fireCd-=dt; al.barkCd-=dt; al.supportCd-=dt; al.stimCd-=dt;
      const wpn = WEAPONS[al.wpn||"fusil"];
      const tgt = nearestEnemy(al.x,al.y, al.roam?99999:660);
      const td = tgt? dist(al.x,al.y,tgt.x,tgt.y) : 1e9;
      let mvx=0,mvy=0,spd=182;
      if(al.roam){ // Vindicados: cazan por el mapa
        if(tgt){ if(td>210){mvx=tgt.x-al.x;mvy=tgt.y-al.y;} else if(td<130){mvx=al.x-tgt.x;mvy=al.y-tgt.y;} }
        else { const o=objectivePoint(); mvx=o.x-al.x; mvy=o.y-al.y; }
        spd=168;
      } else { // escuadra: formación alrededor del jugador + kite si aprietan
        if(tgt && td<74){ mvx=al.x-tgt.x; mvy=al.y-tgt.y; spd=205; }
        else { const ang=(al.slot||0)/(al.slots||1)*6.2832; const fx=player.x+Math.cos(ang)*76, fy=player.y+Math.sin(ang)*76; mvx=fx-al.x; mvy=fy-al.y; }
      }
      const mm=Math.hypot(mvx,mvy)||1; if(mm>7){ al.x+=mvx/mm*spd*dt; al.y+=mvy/mm*spd*dt; }
      // separación entre aliados (no se amontonan)
      for(const o of allies){ if(o===al||!o.alive)continue; const dd=dist(al.x,al.y,o.x,o.y),mn=al.r+o.r+8; if(dd<mn&&dd>0){ al.x+=(al.x-o.x)/dd*46*dt; al.y+=(al.y-o.y)/dd*46*dt; } }
      resolveWalls(al);
      // disparo (con su arma)
      if(tgt && al.fireCd<=0 && td<(al.roam?900:640)){ const a={x:tgt.x-al.x,y:tgt.y-al.y}; const m=Math.hypot(a.x,a.y)||1;a.x/=m;a.y/=m;
        fireWeapon(al,wpn,a,(al.dmgMult||.7),true); al.fireCd=Math.max(.14,(wpn.cd||.3)*1.5); }
      // apoyo con estims (solo escuadra propia)
      if(!al.seaf && !al.roam && al.stimCd<=0 && al.stims>0){
        const follow=dist(al.x,al.y,player.x,player.y);
        if(al.hp/al.hpMax<.45){ al.stims--; al.hp=Math.min(al.hpMax,al.hp+al.hpMax*.5); al.stimCd=9; floatText(al.x,al.y-16,"+","#7fb069"); radio(al.name,"Me curo, aguantad.",al.col); }
        else if(player.hp/player.hpMax<.35 && follow<180){ al.stims--; player.hp=Math.min(player.hpMax,player.hp+Math.round(player.hpMax*.22)); al.stimCd=11; floatText(player.x,player.y-16,"+","#7fb069"); radio(al.name,"¡Aguanta, te cubro!",al.col); }
      }
      if(al.barkCd<=0){ al.barkCd=rr(12,22); if(!al.roam && Math.random()<.4) radio(al.name, pick(RADIO.banter), al.col); }
    }
    // ---- spawn / objetivos según misión ----
    if(missionType==="purga"){
      if(!bossActive){
        spawnTimer-=dt;
        if(spawnQueue.length && spawnTimer<=0 && enemies.length<34){ spawnEnemy(spawnQueue.shift()); spawnTimer=rr(.25,.7); }
        if(spawnQueue.length===0 && enemies.length===0){ nextWave(); }
      }
    } else { contSpawn(dt); }
    // ---- enemigos ----
    for(const e of enemies){ updateEnemy(e,dt); }
    // retirar los muertos (imprescindible para que avancen las oleadas)
    enemies=enemies.filter(e=>e.hp>0);
    // ---- jefe ----
    if(bossActive && boss) updateBoss(dt);
    // ---- apoyo: nave SEAF de riesgo + Vindicados ----
    updateSupport(dt);
    // ---- estratagemas desplegadas ----
    updateStratagems(dt);
    // ---- lógica de objetivo de misión ----
    updateMission(dt);
    if(state!=="playing")return;
    // ---- balas jugador ----
    for(const b of pbullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; }
    // colisión balas->enemigos
    for(const b of pbullets){ if(b.life<=0)continue;
      let target=null;
      if(bossActive&&boss&&dist(b.x,b.y,boss.x,boss.y)<boss.r+b.r){ target={boss:true,x:boss.x,y:boss.y}; }
      else { for(const e of enemies){ if(e.hp>0&&dist(b.x,b.y,e.x,e.y)<e.r+b.r){ target=e; break; } } }
      if(!target && nests){ for(const nst of nests){ if(nst.hp>0&&dist(b.x,b.y,nst.x,nst.y)<nst.r+b.r){ target={nest:nst,x:nst.x,y:nst.y}; break; } } }
      if(!target && deposits){ for(const dp of deposits){ if(dp.hp>0&&dist(b.x,b.y,dp.x,dp.y)<dp.r+b.r){ target={depo:dp,x:dp.x,y:dp.y}; break; } } }
      if(target){
        if(target.boss){ damageBoss(b.dmg); } else if(target.nest){ damageNest(target.nest,b.dmg); } else if(target.depo){ damageDepo(target.depo,b.dmg); } else { damageEnemy(target,b); }
        hitFx(b.x,b.y,b.col);
        if(b.splash){ splashDamage(b.x,b.y,b.splash,b.splashDmg,b.plagueBonus); }
        if(!b.pierce) b.life=0; else { b.pierced=(b.pierced||0)+1; if(b.pierced>3)b.life=0; }
      }
    }
    pbullets=pbullets.filter(b=>b.life>0 && b.x>-40&&b.x<W+40&&b.y>-40&&b.y<H+40);
    // ---- balas enemigas ----
    for(const b of ebullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      if(dist(b.x,b.y,player.x,player.y)<player.r+b.r){ hurtPlayer(b.dmg); b.life=0; hitFx(b.x,b.y,"#4fd6b8"); }
      else { for(const al of allies){ if(al.alive&&dist(b.x,b.y,al.x,al.y)<al.r+b.r){ hurtAlly(al,b.dmg); b.life=0; break; } } }
    }
    ebullets=ebullets.filter(b=>b.life>0 && b.x>-40&&b.x<W+40&&b.y>-40&&b.y<H+40);
    // ---- partículas ----
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.92; p.vy*=.92; p.life-=dt; }
    particles=particles.filter(p=>p.life>0);
    // ---- textos flotantes ----
    if(floats){ for(const f of floats){ f.y-=30*dt; f.life-=dt; } floats=floats.filter(f=>f.life>0); }
    // ---- ambiente del bioma (espacio de pantalla) ----
    if(ambient){ if(biome.ambient!=="none" && ambient.length<70 && Math.random()<.6) spawnAmbient();
      for(const p of ambient){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
      ambient=ambient.filter(p=>p.life>0 && p.x>-12&&p.x<VW+12&&p.y>-12&&p.y<VH+12); }
    // ---- pickups ----
    for(const p of pickups){ if(dist(p.x,p.y,player.x,player.y)<player.r+14){ grab(p); p.dead=true; } }
    pickups=pickups.filter(p=>!p.dead);
    // ---- cámara ----
    cam.x += ((player.x-VW/2)-cam.x)*Math.min(1,dt*6);
    cam.y += ((player.y-VH/2)-cam.y)*Math.min(1,dt*6);
    cam.x=clamp(cam.x,0,W-VW); cam.y=clamp(cam.y,0,H-VH);
    if(shake>0)shake-=dt*40;
    // ---- fin ----
    if(player.hp<=0 && state==="playing"){ defeat(); }
  }

  function nearestEnemy(x,y,maxD=99999){ let best=null,bd=maxD;
    for(const e of enemies){ if(e.hp<=0)continue; const d=dist(x,y,e.x,e.y); if(d<bd){bd=d;best=e;} }
    if(bossActive&&boss){ const d=dist(x,y,boss.x,boss.y); if(d<bd){bd=d;best=boss;} }
    if(nests)for(const nst of nests){ if(nst.hp>0){ const d=dist(x,y,nst.x,nst.y); if(d<bd){bd=d;best=nst;} } }
    return best; }

  function resolveWalls(ent){
    for(const wl of walls){
      if(ent.x> wl.x-ent.r && ent.x< wl.x+wl.w+ent.r && ent.y> wl.y-ent.r && ent.y< wl.y+wl.h+ent.r){
        const dl=Math.abs(ent.x-(wl.x-ent.r)), dr=Math.abs(ent.x-(wl.x+wl.w+ent.r)), du=Math.abs(ent.y-(wl.y-ent.r)), dd=Math.abs(ent.y-(wl.y+wl.h+ent.r));
        const m=Math.min(dl,dr,du,dd);
        if(m===dl)ent.x=wl.x-ent.r; else if(m===dr)ent.x=wl.x+wl.w+ent.r; else if(m===du)ent.y=wl.y-ent.r; else ent.y=wl.y+wl.h+ent.r;
      }
    }
  }

  function fireWeapon(src,def,dir,mult,fromPlayer){
    const n=def.pellets||1;
    for(let i=0;i<n;i++){
      const sp=(def.spread||0)*(fromPlayer&&src===player&&player.spread?player.spread:1); const ang=Math.atan2(dir.y,dir.x)+rr(-sp,sp);
      const b={x:src.x+Math.cos(ang)*(src.r+4),y:src.y+Math.sin(ang)*(src.r+4),vx:Math.cos(ang)*def.spd,vy:Math.sin(ang)*def.spd,
        life:def.life,r:def.splash?6:3,dmg:def.dmg*mult,col:def.col,pierce:def.pierce,splash:def.splash,splashDmg:def.splashDmg,plagueBonus:def.plagueBonus};
      pbullets.push(b);
    }
    if(fromPlayer){ shake=Math.min(shake+(def.splash?4:1.2),8); muzzle(src,dir,def.col); }
  }
  function muzzle(src,dir,col){ for(let i=0;i<3;i++)particles.push({x:src.x+dir.x*src.r,y:src.y+dir.y*src.r,vx:dir.x*rr(60,160)+rr(-40,40),vy:dir.y*rr(60,160)+rr(-40,40),life:rr(.1,.22),r:rr(1,2.4),col}); }
  function hitFx(x,y,col){ for(let i=0;i<6;i++){const a=Math.random()*6.28,s=rr(60,200);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rr(.15,.4),r:rr(1,2.6),col});} }
  function boom(x,y,r,col){ shake=Math.min(shake+6,12); for(let i=0;i<26;i++){const a=Math.random()*6.28,s=rr(80,320);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rr(.2,.6),r:rr(2,5),col});} }

  function isPlague(){return true;} // todos los enemigos son Plaga
  function damageEnemy(e,b){
    const def=ENEMIES[e.type];
    let dmg=b.dmg; if(def.armor)dmg=Math.max(1,dmg-def.armor);
    if(b.plagueBonus)dmg*=b.plagueBonus;
    if(GAME.character.base==="marcado")dmg*=1.25;
    e.hp-=dmg; e.hit=.08;
    if(e.hp<=0)killEnemy(e);
  }
  function splashDamage(x,y,r,dmg,pb){
    if(player&&player.senda==="zapador")dmg*=1.25;
    boom(x,y,r,"#ffb066");
    for(const e of enemies){ if(e.hp>0){ const d=dist(x,y,e.x,e.y); if(d<r){ let dd=dmg*(1-d/r); if(pb)dd*=pb; if(GAME.character.base==="marcado")dd*=1.25; e.hp-=dd; e.hit=.08; if(e.hp<=0)killEnemy(e);} } }
    if(bossActive&&boss){ const d=dist(x,y,boss.x,boss.y); if(d<r+boss.r) damageBoss(dmg*(pb||1)*.6); }
    if(nests)for(const nst of nests){ if(nst.hp>0){ const d=dist(x,y,nst.x,nst.y); if(d<r+nst.r) damageNest(nst,dmg*(pb||1)*.6); } }
    if(deposits)for(const dp of deposits){ if(dp.hp>0){ const d=dist(x,y,dp.x,dp.y); if(d<r+dp.r) damageDepo(dp,dmg*(pb||1)*.6); } }
  }
  function killEnemy(e){
    if(e._dead)return; e._dead=true;
    const def=ENEMIES[e.type];
    GAME.character.kills++; GAME.character.xp=(GAME.character.xp||0)+Math.round(2+(ENEMIES[e.type].hp)/26);
    boom(e.x,e.y,e.r*2,e.col);
    if(def.explode){ splashHitsPlayer(e.x,e.y,def.explode.r,def.explode.dmg*(edmgMul||1)); boom(e.x,e.y,def.explode.r,"#8fd66a"); }
    if(Math.random()<.14) pickups.push({x:e.x,y:e.y,kind:Math.random()<.6?"ammo":"heal"});
    e.hp=0; e._kdrop=true;
  }
  function splashHitsPlayer(x,y,r,dmg){ const d=dist(x,y,player.x,player.y); if(d<r+player.r)hurtPlayer(dmg*(1-d/(r+player.r))); for(const al of allies){if(al.alive){const dd=dist(x,y,al.x,al.y);if(dd<r+al.r)hurtAlly(al,dmg*.6);}} }

  function updateEnemy(e,dt){
    if(e.hp<=0)return;
    const def=ENEMIES[e.type];
    if(e.hit>0)e.hit-=dt;
    if(e.slowT>0)e.slowT-=dt;
    const spd = def.speed*(e.slowT>0?.5:1);
    const objT=(missionType==="defensa" && objective && objective.hp>0 && def.behavior==="chase");
    const tx=objT?objective.x:player.x, ty=objT?objective.y:player.y;
    const d=dist(e.x,e.y,tx,ty);
    let dx=tx-e.x, dy=ty-e.y, m=Math.hypot(dx,dy)||1; dx/=m;dy/=m;
    if(def.behavior==="chase"){
      e.x+=dx*spd*dt; e.y+=dy*spd*dt;
      if(objT){ if(d<e.r+objective.r+2){ objective.hp-=def.dmg*(edmgMul||1)*dt*3; objective.hit=.1; e.x-=dx*12*dt; e.y-=dy*12*dt; } }
      else if(d<e.r+player.r+2){ if(player.iframe<=0)hurtPlayer(def.dmg*(edmgMul||1)*dt*1.9); if(GAME.character.base==="coloso"){ e.x-=dx*60*dt;e.y-=dy*60*dt; } }
    } else if(def.behavior==="ranged"){
      if(d>def.range){ e.x+=dx*spd*dt; e.y+=dy*spd*dt; }
      else if(d<def.range*.6){ e.x-=dx*spd*dt; e.y-=dy*spd*dt; }
      e.fireCd-=dt; if(e.fireCd<=0 && d<def.range*1.2){ enemyShoot(e,dx,dy,def); e.fireCd=def.fireCd; }
    } else if(def.behavior==="kite"){
      if(d>def.range){ e.x+=dx*spd*dt; e.y+=dy*spd*dt; }
      else if(d<def.range*.7){ e.x-=dx*spd*.8*dt; e.y-=dy*spd*.8*dt; }
      e.fireCd-=dt; if(e.fireCd<=0 && d<def.range*1.3){ for(let i=0;i<(def.burst||1);i++)setTimeout(()=>{ if(e.hp>0)enemyShoot(e,(player.x-e.x),(player.y-e.y),def);},i*110); e.fireCd=def.fireCd; }
    }
    // separación simple entre enemigos
    for(const o of enemies){ if(o===e||o.hp<=0)continue; const dd=dist(e.x,e.y,o.x,o.y); const min=e.r+o.r; if(dd<min&&dd>0){ const px=(e.x-o.x)/dd,py=(e.y-o.y)/dd; e.x+=px*(min-dd)*.5; e.y+=py*(min-dd)*.5; } }
    resolveWalls(e);
    // colisión con aliados
    for(const al of allies){ if(al.alive&&dist(e.x,e.y,al.x,al.y)<e.r+al.r+2){ if(def.behavior==="chase")hurtAlly(al,def.dmg*(edmgMul||1)*dt*1.6); } }
  }
  function enemyShoot(e,dx,dy,def){ const m=Math.hypot(dx,dy)||1; const ang=Math.atan2(dy/m,dx/m)+rr(-.05,.05); ebullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*(def.projSpd||320),vy:Math.sin(ang)*(def.projSpd||320),life:2.2,r:5,dmg:def.dmg*(edmgMul||1)}); }

  /* ---------- jefe ---------- */
  function updateBoss(dt){
    const b=boss;
    b.hit=Math.max(0,(b.hit||0)-dt);
    const ph = b.hp/b.hpMax;
    b.phase = ph>.66?1: ph>.33?2:3;
    let dx=player.x-b.x, dy=player.y-b.y, m=Math.hypot(dx,dy)||1; dx/=m;dy/=m;
    const spd = b.phase===1?60: b.phase===2?95:120;
    // carga en fase 2/3
    if(b.chargeT>0){ b.chargeT-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt; }
    else { b.x+=dx*spd*dt; b.y+=dy*spd*dt; }
    b.x=clamp(b.x,60,W-60); b.y=clamp(b.y,60,H-60);
    if(dist(b.x,b.y,player.x,player.y)<b.r+player.r){ if(player.iframe<=0)hurtPlayer(26*(edmgMul||1)*dt*2); }
    // ataques
    b.atkCd-=dt; b.summonCd-=dt;
    if(b.atkCd<=0){
      if(b.phase>=2 && Math.random()<.45){ // carga
        b.vx=dx* (b.phase===3?520:420); b.vy=dy*(b.phase===3?520:420); b.chargeT=.5; toastMini();
        b.atkCd=b.phase===3?1.6:2.2;
      } else { // salva radial
        const n=b.phase===3?16:b.phase===2?12:9;
        for(let i=0;i<n;i++){ const a=i/n*6.28; ebullets.push({x:b.x,y:b.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,life:2.6,r:6,dmg:11*(edmgMul||1)}); }
        if((bossDef||{}).ranged){ for(let i=-1;i<=1;i++){ const a=Math.atan2(dy,dx)+i*.16; ebullets.push({x:b.x,y:b.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,life:2.2,r:6,dmg:13*(edmgMul||1)}); } }
        b.atkCd=b.phase===3?1.9:2.6;
      }
    }
    if(b.summonCd<=0 && enemies.length<26){
      const bd=bossDef||BOSSES.reina; const t=b.phase===3?bd.summon3:bd.summon; const def=ENEMIES[t]; const cnt=b.phase===3?3:2;
      for(let i=0;i<cnt;i++){ const a=Math.random()*6.28; enemies.push({type:t,x:b.x+Math.cos(a)*70,y:b.y+Math.sin(a)*70,r:def.r,hp:def.hp,hpMax:def.hp,fireCd:1,col:def.col,hit:0}); }
      b.summonCd=b.phase===3?3.5:5.5;
    }
  }
  function damageBoss(dmg){ if(!boss)return; if(GAME.character.base==="marcado"&&fac==="plaga")dmg*=1.25; boss.hp-=dmg; boss.hit=.07;
    if(boss.hp<=0){ boss.hp=0; bossActive=false; bossKilled=true; boom(boss.x,boss.y,140,(bossDef||BOSSES.reina).core); if(missionType==="purga"||missionType==="defensa")victory(); } }
  function toastMini(){ /* señal visual de carga */ shake=Math.min(shake+3,10); }

  /* ---------- daño al jugador / aliados ---------- */
  function hurtPlayer(dmg){
    if(player.iframe>0 || shieldT>0)return;
    if(player.base==="rompemuros")dmg*=.7;
    if(buffs.coraza>0)dmg*=.5;
    dmg*=(player.dmgTaken||1);
    player.hp-=dmg; shake=Math.min(shake+dmg*.25,10);
  }
  function hurtAlly(al,dmg){ al.hp-=dmg; if(al.hp<=0&&al.alive){ al.alive=false; boom(al.x,al.y,26,"#e0cf9a");
    // revivir (Centinela)
    if(player.revives>0){ player.revives--; al.alive=true; al.hp=al.hpMax*.6; toast(`${al.name.toUpperCase()} REANIMADO`); }
    else { toast(`${al.name.toUpperCase()} HA CAÍDO`); }
  } }
  function grab(p){ if(p.kind==="ammo"){ for(const w of player.weapons){ w.ammo=WEAPONS[w.key].mag; } toast("MUNICIÓN"); }
    else { player.hp=Math.min(player.hpMax,player.hp+Math.round(player.hpMax*.18)); toast("VENDAS"); } }

  /* ---------- resultado ---------- */
  function finishCommon(){ running=false; cancelAnimationFrame(raf); unbindInput(); state="over";
    const c=GAME.character, s=sector; c.missionsDone++; GAME.war.missions++;
    // sincronizar bajas de aliados con la escuadra persistente
    for(const al of allies){ if(!al.alive && al.ref){ al.ref.alive=false; } }
  }
  function victory(){
    finishCommon(); const c=GAME.character, s=sector; if(bossKilled)c.bosses++;
    const M=MISSIONS[missionType]||MISSIONS.purga, F=FACTIONS[fac]||FACTIONS.plaga;
    const subDone = subObj && subObj.done;
    const rew=(diff?diff.rew:1);
    const gain = Math.round(((s.threat==="crítica"?34:s.threat==="alta"?26:s.threat==="media"?20:14) + (subDone?8:0)) * (0.7+rew*0.3));
    s.ctl=clamp(s.ctl+gain); GAME.war.plaga=clamp(GAME.war.plaga-6); c.glory+=Math.round((Math.round(gain/3)+5)*rew);
    // recompensa en Réditos (escalada por dificultad)
    const req=Math.round(reqReward(missionType, subDone)*rew); GAME.req=(GAME.req||0)+req; reqEarned=req;
    const prevRank=c.rank; updateSectorStatus(s); c.rank=rankFor(c.glory); awardMedals();
    const promoted = c.rank!==prevRank;
    if(promoted){ const ri=rankInfo(c.glory); GAME.news.unshift({kind:"decree",src:"ALTO MANDO · ASCENSO",time:`CICLO ${GAME.war.missions}`,hl:`${c.name} asciende a ${c.rank}`,bd:`Por servicio ejemplar a la Corona, el frente reconoce un nuevo ${ri.ico} ${c.rank}.`}); }
    const body = missionType==="defensa"?`${c.name} sostuvo el Reactor de la Corona hasta la evacuación.`
      : missionType==="asalto"?`${c.name} arrasó los nidos de ${F.nm} en ${s.nm}.`
      : missionType==="sabotaje"?`${c.name} colapsó la red de ${F.nm} desde dentro.`
      : `${c.name} derribó a ${bossDef?bossDef.nm:"la Reina"}.`;
    GAME.news.unshift({kind:"win",src:`FRENTE · ${s.co}`,time:`CICLO ${GAME.war.missions}`,
      hl:s.status==="liberado"?`¡${s.nm} LIBERADO!`:`${M.nm} logrado en ${s.nm}`,
      bd:`${body} Control imperial al ${s.ctl}%.${subDone?" Objetivo extra cumplido.":""} +${req} Réditos.`});
    if(Math.random()<.6)GAME.news.unshift({kind:"decree",src:"EDICTO DEL TRONO",time:`CICLO ${GAME.war.missions}`,hl:pick(DECREES),bd:"— Por orden de la Corona Eterna."});
    // experiencia de misión y subida de nivel
    const mxp=Math.round((30 + gain*1.2 + (bossKilled?40:0) + (subDone?20:0))*(0.8+rew*0.2));
    const leveled=gainXP(c,mxp);
    if(leveled){ GAME.news.unshift({kind:"win",src:"REGISTRO DEL TRONO",time:`CICLO ${GAME.war.missions}`,hl:`${c.name} asciende a Nivel ${c.level}`,bd:`Nuevo nivel alcanzado. ${c.points} punto(s) de atributo por repartir en la ficha del Escuadrón.`}); }
    galaxyTick(); recomputeLiberation();
    outcome={win:true,gain,s,title:`${M.nm.toUpperCase()} LOGRADO`,body,req,subDone,mxp,leveled,level:c.level,promoted,rank:c.rank}; save(); showOverlay();
  }
  function defeat(reason){
    if(state==="over")return;
    finishCommon(); const c=GAME.character, s=sector;
    s.ctl=clamp(s.ctl-10); GAME.war.plaga=clamp(GAME.war.plaga+4); updateSectorStatus(s);
    GAME.war.fallen.push({name:c.name,rank:c.rank,base:BASES[c.base].nm,glory:c.glory,missions:c.missionsDone});
    GAME.news.unshift({kind:"war",src:"LISTA DE HONOR",time:`CICLO ${GAME.war.missions}`,hl:`Cae ${c.name}, ${c.rank}`,bd:`Abatido en ${s.nm} tras ${c.missionsDone} misión(es). La galaxia continúa sin él; la Corona ya llama al siguiente.`});
    galaxyTick(); recomputeLiberation(); outcome={win:false,s,reason}; const dead={...c}; GAME.character=null; save(); showOverlay(dead);
  }

  /* ---------- overlay de resultado (DOM sobre el canvas) ---------- */
  function showOverlay(dead){
    if(hud.boss)hud.boss.style.display="none";
    const win=outcome.win, s=outcome.s;
    const box=document.createElement("div");
    box.className="over "+(win?"victory":"defeat");
    box.innerHTML = win
     ? `<div><div class="eyebrow" style="color:var(--gold-dim)">${outcome.title||"Objetivo logrado"} · ${s.nm}</div>
        <h2>VICTORIA</h2>
        <p>${outcome.body||""} Control al <b class="gold">${s.ctl}%</b> · <b class="plague">+${outcome.req||0} ◈</b> · <b class="gold">+${outcome.mxp||0} XP</b>${outcome.subDone?' · <b class="plague">Extra ✓</b>':''}.</p>
        ${outcome.leveled?`<p style="color:var(--gold);font-family:var(--display);font-weight:700">▲ ¡NIVEL ${outcome.level}! ${GAME.character.points} punto(s) de atributo para repartir en la ficha.</p>`:''}
        ${outcome.promoted?`<p style="color:var(--crimson-lit);font-family:var(--display);font-weight:700">✠ ASCENSO · ahora eres <b>${esc(outcome.rank)}</b></p>`:''}
        <div class="btnrow" style="justify-content:center"><button class="btn" onclick="Arena.exit('personaje')">Ver ficha ▸</button><button class="btn primary" onclick="Arena.exit('hub')">Volver al puente ▸</button></div></div>`
     : `<div><div class="eyebrow" style="color:var(--crimson)">La lista de honor se alarga</div>

      ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(wl.x+6,wl.y+8,wl.w,wl.h); // sombra
      const wg=ctx.createLinearGradient(wl.x,wl.y,wl.x,wl.y+wl.h); wg.addColorStop(0,shade(bm.cover,14)); wg.addColorStop(1,shade(bm.cover,-14));
      ctx.fillStyle=wg; ctx.fillRect(wl.x,wl.y,wl.w,wl.h);

      ctx.strokeStyle=bm.border; ctx.lineWidth=1.6; ctx.strokeRect(wl.x+1,wl.y+1,wl.w-2,wl.h-2);

    }

    ctx.fillStyle=vg; ctx.fillRect(cam.x-sx,cam.y-sy,VW,VH);

  function drawMarkers(){
    const targets=[];
    if(objective&&objective.hp>0)targets.push([objective.x,objective.y,"#c9a24b"]);
    if(nests)for(const n of nests){ if(n.hp>0)targets.push([n.x,n.y,"#4fd6b8"]); }
    if(terminals)for(const tm of terminals){ if(!tm.active)targets.push([tm.x,tm.y,"#8a6bd6"]); }
    if(samples)for(const sm of samples){ if(!sm.got)targets.push([sm.x,sm.y,"#4fd6b8"]); }
    if(deposits)for(const dp of deposits){ if(dp.hp>0)targets.push([dp.x,dp.y,"#e0554a"]); }
    if(bossActive&&boss)targets.push([boss.x,boss.y,"#e0554a"]);
    for(const [wx,wy,col] of targets){ const sxp=wx-cam.x, syp=wy-cam.y;
      if(sxp>18&&sxp<VW-18&&syp>18&&syp<VH-18)continue;
      const px=clamp(sxp,18,VW-18), py=clamp(syp,18,VH-18), ang=Math.atan2(syp-VH/2,sxp-VW/2);
      ctx.save();ctx.translate(px,py);ctx.rotate(ang);
      ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-5,-5);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();
      ctx.restore();
    }

  function drawEnemy(e){

  /* ---- Robots (La Legión de Hierro) ---- */
  function drawBot(e,def,col,r,T){

  }

  return { mount, pause, exit,
    stop(){ running=false; cancelAnimationFrame(raf); try{unbindInput();}catch(e){} } };
})();

    if(touchMove.active){x=touchMove.x;y=touchMove.y;}
    const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;}
    if(m>.05){ faceX=x;faceY=y; }
    const sp=210; px=clamp(px+x*sp*dt,24,VW-24); py=clamp(py+y*sp*dt,64,VH-24);

    ctx.fillText("HOLOMESA DEL FRENTE", hx, hy+ry+18);

    drawHubPlayer(c);
  }
  function drawNPC(n, hot){
    ctx.save();
    // plataforma
    ctx.fillStyle="rgba(201,162,75,.05)"; ctx.strokeStyle=hot?n.col:"rgba(120,110,90,.4)"; ctx.lineWidth=hot?2:1;
    ctx.beginPath();ctx.ellipse(n.sx,n.sy+14,30,10,0,0,6.28);ctx.fill();ctx.stroke();

    ctx.fillStyle=n.col; ctx.beginPath();ctx.arc(n.sx,n.sy,13,0,6.28);ctx.fill();
    ctx.strokeStyle="#0b0807";ctx.lineWidth=2;ctx.stroke();

const Galaxy = (()=>{
  let cv, ctx, VW, VH, running=false, raf=0, lastT=0, t=0;
  let cx, cy, R, nodes=[], hover=null, tipEl, built=false;
  let planetsF=[], sectorsF=[], links=[];
  const isTouch=matchMedia("(pointer:coarse)").matches;
  function mulberry(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let x=Math.imul(a^a>>>15,1|a); x=x+Math.imul(x^x>>>7,61|x)^x; return((x^x>>>14)>>>0)/4294967296; }; }

  function build(){
    const rng=mulberry(0xC0FFEE);
    const secs=GAME.war.sectors, perRing=6;
    sectorsF=secs.map((s,i)=>{ const ring=Math.floor(i/perRing), idx=i%perRing;
      const af=(idx/perRing)*6.2832 + ring*0.62 + rng()*0.16;
      const rf=Math.min(0.92, 0.3 + ring*0.15 + rng()*0.05);
      return {id:s.id, af, rf}; });
    // planetas decorativos
    planetsF=[]; for(let i=0;i<170;i++){ const af=rng()*6.2832, rf=Math.sqrt(rng())*0.98; planetsF.push({af,rf,sz:0.6+rng()*2.6,br:rng()<0.16}); }
    // líneas de suministro
    links=[]; for(let i=0;i<sectorsF.length;i++){ links.push(["cs",i,-1]); }
    for(let i=0;i<sectorsF.length;i++){ // conectar con el vecino angular
      let best=-1,bd=99; for(let j=0;j<sectorsF.length;j++){ if(i===j)continue; let d=Math.abs(sectorsF[i].af-sectorsF[j].af); d=Math.min(d,6.2832-d); if(d<bd){bd=d;best=j;} }
      if(best>i) links.push(["ss",i,best]);
    }
    built=true;
  }
  function layout(){ const maxW=Math.min(1120,(window.innerWidth-36)); VW=Math.round(maxW); VH=Math.round(Math.min(660,Math.max(500,window.innerHeight*0.68))); }

  function mount(){
    if(!GAME.character){ go("roster"); return; }
    if(!built) build();

    const w=GAME.war;
    app.innerHTML=header()+tabs()+`
      <div id="gxWrap" class="galaxy-wrap" style="max-width:${VW}px;margin:0 auto">

      <footer class="foot"><span>CORONA ESTELAR · MAPA GALÁCTICO</span><span>Ciclo ${w.missions} · Sectores ${w.sectors.length} · Liberados ${w.liberated}</span></footer>`;
    cv=$("#galaxy"); ctx=cv.getContext("2d"); tipEl=$("#gxTip"); hover=null;
    cv.addEventListener("mousemove",onMove); cv.addEventListener("click",onClick); cv.addEventListener("mouseleave",()=>{hover=null;tipEl.classList.remove("show");});
    running=true; lastT=performance.now(); raf=requestAnimationFrame(loop);
  }
  function stop(){ running=false; cancelAnimationFrame(raf); if(cv){ cv.removeEventListener("mousemove",onMove); cv.removeEventListener("click",onClick); } }

  function computeNodes(){
    cx=VW/2; cy=VH*0.5; R=Math.min(VW/2,VH/2)-28;
    nodes=sectorsF.map(sf=>{ const sector=GAME.war.sectors.find(x=>x.id===sf.id)||GAME.war.sectors[0]; return { ...sf, sector, x:cx+Math.cos(sf.af)*R*sf.rf, y:cy+Math.sin(sf.af)*R*sf.rf, r:11 }; });
  }
  function onMove(e){ const rect=cv.getBoundingClientRect(); const mx=(e.clientX-rect.left)/rect.width*VW, my=(e.clientY-rect.top)/rect.height*VH;
    hover=null; for(const n of nodes){ if(dist(mx,my,n.x,n.y)<n.r+9){ hover=n; break; } }
    if(hover){ const s=hover.sector, M=planetMeta(s.id), bm=BIOMES[M.biome]||DEFBIOME, F=facOf(s); tipEl.style.left=(hover.x/VW*100)+"%"; tipEl.style.top=(hover.y/VH*100)+"%";
      const tc=s.threat==="crítica"?"#cf4b3f":s.threat==="alta"?"#d99a2b":s.threat==="media"?"#c9a24b":"#7fb069";
      tipEl.innerHTML=`<div class="tn">${s.nm}</div><div class="tc" style="color:${tc}">${s.co} · ${s.status==="liberado"?"LIBERADO":s.status==="caído"?"CAÍDO":"AMENAZA "+s.threat.toUpperCase()}</div><div class="tbar"><i style="width:${s.ctl}%"></i></div><div class="th">Control ${s.ctl}% · Resistencia ${s.resistance||0}%</div><div class="th" style="color:${F.col}">${F.nm} · ${bm.nm}</div>`;
      tipEl.classList.add("show"); cv.style.cursor="pointer";
    } else { tipEl.classList.remove("show"); cv.style.cursor="crosshair"; }
  }
  function onClick(e){ const rect=cv.getBoundingClientRect(); const mx=(e.clientX-rect.left)/rect.width*VW, my=(e.clientY-rect.top)/rect.height*VH;
    for(const n of nodes){ if(dist(mx,my,n.x,n.y)<n.r+9){ stop(); briefing(n.sector.id); return; } } }

  function loop(ts){ if(!running)return; let dt=(ts-lastT)/1000; lastT=ts; if(dt>.05)dt=.05; t+=dt; draw(); raf=requestAnimationFrame(loop); }

  function polar(af,rf){ return [cx+Math.cos(af)*R*rf, cy+Math.sin(af)*R*rf]; }

  function draw(){
    computeNodes();
    ctx.clearRect(0,0,VW,VH);
    // halo central
    const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,R); halo.addColorStop(0,"rgba(60,80,110,.16)"); halo.addColorStop(.5,"rgba(30,40,60,.06)"); halo.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=halo; ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.fill();
    // rejilla-telaraña: anillos + radios
    ctx.strokeStyle="rgba(120,140,170,.09)"; ctx.lineWidth=1;
    for(let k=1;k<=7;k++){ ctx.beginPath();ctx.arc(cx,cy,R*k/7,0,6.2832);ctx.stroke(); }
    for(let k=0;k<16;k++){ const a=k/16*6.2832; ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.stroke(); }
    // territorios de facción (celdas por sector)
    for(const n of nodes){ drawTerritory(n); }
    ctx.save(); ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.clip();
    // líneas de suministro (animadas)
    ctx.lineWidth=1.2; ctx.setLineDash([5,7]); ctx.lineDashOffset=-(t*22)%12;
    for(const [type,i,j] of links){ const a=nodes[i]; const b= type==="cs"?{x:cx,y:cy}:nodes[j];
      const lit = hover&&(hover===a||hover===b); ctx.strokeStyle=lit?"rgba(201,162,75,.55)":"rgba(120,140,170,.18)";
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke(); }
    ctx.setLineDash([]);
    // planetas neutrales
    for(const p of planetsF){ const [x,y]=polar(p.af,p.rf); ctx.fillStyle=p.br?"rgba(160,190,220,.9)":"rgba(143,176,207,.6)"; ctx.beginPath();ctx.arc(x,y,p.sz,0,6.2832);ctx.fill();
      if(p.br){ ctx.strokeStyle="rgba(160,190,220,.3)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,p.sz+2.5,0,6.2832);ctx.stroke(); } }
    ctx.restore();
    // estrella central (Solmyr)
    drawStar();
    // nodos de sector
    for(const n of nodes){ drawSectorNode(n); }
  }
  function drawTerritory(n){
    const s=n.sector;
    const col = s.status==="liberado"?"#c9a24b": s.status==="caído"?facOf(s).col : facOf(s).col;
    const frac = s.status==="liberado"?1: s.status==="caído"?1: (1 - s.ctl/100)*0.9 + 0.1;
    const rlo=Math.max(R*0.2, R*(n.rf-0.1)), rhi=Math.min(R, R*(n.rf+0.11));
    const aw=0.34, nr=2, na=3, total=nr*na; let idx=0;
    for(let ir=0;ir<nr;ir++){ for(let ia=0;ia<na;ia++){
      const r0=rlo+(rhi-rlo)*ir/nr, r1=rlo+(rhi-rlo)*(ir+1)/nr;
      const a0=n.af-aw+(aw*2)*ia/na, a1=n.af-aw+(aw*2)*(ia+1)/na;
      const on = (idx/total) < frac; idx++;
      ctx.beginPath();
      ctx.arc(cx,cy,r1,a0,a1); ctx.arc(cx,cy,r0,a1,a0,true); ctx.closePath();
      ctx.fillStyle = on? col : "rgba(90,100,120,.05)"; ctx.globalAlpha = on? 0.42 : 1; ctx.fill();
      ctx.globalAlpha=1; ctx.strokeStyle= on? "rgba(0,0,0,.35)":"rgba(120,140,170,.07)"; ctx.lineWidth=1; ctx.stroke();
    } }
  }
  function drawStar(){
    const pr=REDUCE?0:Math.sin(t*1.8)*2;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,34+pr); g.addColorStop(0,"rgba(255,238,190,.95)"); g.addColorStop(.4,"rgba(201,162,75,.6)"); g.addColorStop(1,"rgba(201,162,75,0)");
    ctx.fillStyle=g; ctx.beginPath();ctx.arc(cx,cy,34+pr,0,6.2832);ctx.fill();
    ctx.fillStyle="#ffe9b0"; ctx.beginPath();
    for(let i=0;i<8;i++){ const a=i/8*6.2832 - Math.PI/2; const rr2=i%2?5:12; const x=cx+Math.cos(a)*rr2,y=cy+Math.sin(a)*rr2; i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(201,162,75,.95)"; ctx.font="700 11px Cinzel, serif"; ctx.textAlign="center"; ctx.fillText("SOLMYR", cx, cy+30);
  }
  function drawSectorNode(n){
    const s=n.sector, hot=hover===n, F=facOf(s);
    const ringCol=s.status==="liberado"?"#c9a24b":s.status==="caído"?"#b3312b":F.col;
    if(hot){ ctx.globalAlpha=.5; ctx.fillStyle=ringCol; ctx.beginPath();ctx.arc(n.x,n.y,n.r+8,0,6.2832);ctx.fill(); ctx.globalAlpha=1; }
    const pg=ctx.createRadialGradient(n.x-3,n.y-3,1,n.x,n.y,n.r); pg.addColorStop(0,"#2a2620"); pg.addColorStop(1,"#0c0a09");
    ctx.fillStyle=pg; ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,6.2832);ctx.fill();
    // anillo de control
    ctx.lineWidth=3; ctx.strokeStyle="rgba(40,30,26,.9)"; ctx.beginPath();ctx.arc(n.x,n.y,n.r+3,0,6.2832);ctx.stroke();
    ctx.strokeStyle=ringCol; ctx.beginPath();ctx.arc(n.x,n.y,n.r+3,-Math.PI/2, -Math.PI/2 + 6.2832*(s.ctl/100)); ctx.stroke();
    // núcleo teñido por facción
    ctx.fillStyle=s.status==="liberado"?"#c9a24b":F.col; ctx.globalAlpha=.9; ctx.beginPath();ctx.arc(n.x,n.y,3.2,0,6.2832);ctx.fill(); ctx.globalAlpha=1;
    // estrella si es liberado
    if(s.status==="liberado"){ ctx.fillStyle="#ffe9b0"; ctx.font="9px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("★",n.x,n.y+.5); ctx.textBaseline="alphabetic"; }
    // etiqueta solo al pasar el ratón (para no saturar)
    if(hot){ ctx.fillStyle="#e8dcc4"; ctx.font="700 11px Cinzel, serif"; ctx.textAlign="center"; ctx.fillText(s.nm, n.x, n.y - n.r - 8); }
  }
  return { mount, stop };
})();

/* ---------- fondo de brasas ---------- */
(function starfield(){
  const cv=$("#stars"),ctx=cv.getContext("2d"); let w,h,stars,embers;
  function size(){ w=cv.width=innerWidth;h=cv.height=innerHeight;
    stars=Array.from({length:80},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.2,t:Math.random()*6.28}));
    embers=Array.from({length:REDUCE?0:24},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*.4+.15,r:Math.random()*1.6+.4})); }
  size(); addEventListener("resize",size);
  function frame(){ ctx.clearRect(0,0,w,h);
    for(const s of stars){ s.t+=.02;const a=.35+Math.sin(s.t)*.25; ctx.fillStyle=`rgba(201,162,75,${a*.5})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill(); }
    for(const e of embers){ e.y-=e.s;if(e.y<-4){e.y=h+4;e.x=Math.random()*w;} ctx.fillStyle="rgba(179,49,43,.5)";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.3);ctx.fill(); }
    if(!REDUCE)requestAnimationFrame(frame); }
  if(REDUCE){ ctx.clearRect(0,0,w,h); for(const s of stars){ctx.fillStyle="rgba(201,162,75,.3)";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill();} } else frame();
})();

// si una recarga dejó el estado dentro de la arena (no persistible), volver a un lugar seguro
if(GAME.screen==="arena"){ GAME.screen = GAME.character? "hub":"intro"; GAME.tab="frente"; }
if(GAME.screen==="hub" && GAME.character){ Hub.mount(); }
else if(GAME.screen==="galaxy" && GAME.character){ Galaxy.mount(); }
else render();
</script>
