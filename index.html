<title>Corona Estelar</title>
<meta name="description" content="RPG táctico de guerra galáctica donde cada acción pesa: razas, reinos, un frente compartido y tiradas de d20 con consecuencias permanentes." />
<style>
  /* ============================================================
     CORONA ESTELAR — El Frente Eterno
     Terminal de mando: mundo oscuro comprometido (single-theme).
     ============================================================ */
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap');

  :root{
    --void:#0d0a0b;      /* fondo, acero ensangrentado */
    --panel:#16110f;     /* paneles */
    --panel-2:#1e1714;   /* paneles elevados */
    --line:#3a2c22;      /* bordes/latón oxidado */
    --line-soft:#2a2019;
    --gold:#c9a24b;      /* oro imperial / la Corona */
    --gold-dim:#8f7233;
    --crimson:#b3312b;   /* la Plaga / peligro */
    --crimson-lit:#e0554a;
    --plague:#4fd6b8;    /* infección espectral (enemigo) */
    --parch:#e8dcc4;     /* texto pergamino */
    --parch-dim:#b6a888;
    --ash:#7c6f5e;       /* texto tenue */
    --ok:#7fb069;        /* semántico bueno */
    --warn:#d99a2b;      /* semántico aviso */
    --bad:#cf4b3f;       /* semántico crítico */
    --mono:'Share Tech Mono',ui-monospace,monospace;
    --serif:'Spectral',Georgia,serif;
    --display:'Cinzel',serif;
    --maxw:1180px;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--void);color:var(--parch);
    font-family:var(--serif);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
  .app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 18px 90px}

  a{color:var(--gold)}
  h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.02em}
  .mono{font-family:var(--mono)}
  .label{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--ash)}
  .gold{color:var(--gold)}.crimson{color:var(--crimson-lit)}.plague{color:var(--plague)}.dim{color:var(--ash)}

  /* ---------- Cabecera ---------- */
  header.top{padding:26px 0 14px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .sigil{width:46px;height:46px;flex:none}
  .brand h1{font-size:clamp(22px,4vw,34px);font-weight:900;color:var(--gold);line-height:1}
  .brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--gold-dim);text-transform:uppercase;margin-top:4px}
  .oath{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ash);max-width:230px;text-align:right}

  /* ---------- Navegación (pestañas de consola) ---------- */
  nav.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:18px;border:1px solid var(--line);background:#0b0807}
  nav.tabs button{flex:1 1 auto;background:transparent;border:0;border-right:1px solid var(--line-soft);
    color:var(--parch-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:12px;
    padding:11px 10px;cursor:pointer;transition:.15s;position:relative;white-space:nowrap}
  nav.tabs button:last-child{border-right:0}
  nav.tabs button:hover{color:var(--parch);background:#120d0b}
  nav.tabs button[aria-current="true"]{color:var(--gold);background:linear-gradient(180deg,#1b1310,#120d0b)}
  nav.tabs button[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold)}
  nav.tabs button:disabled{opacity:.32;cursor:not-allowed}

  /* ---------- HUD persistente ---------- */
  .hud{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:20px}
  .hud .card{padding:14px 16px}
  .vitals{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .avatar{width:44px;height:44px;border:1px solid var(--line);background:#0b0807;display:grid;place-items:center;font-size:22px;flex:none}
  .vitals .who .name{font-family:var(--display);font-weight:700;font-size:17px;color:var(--parch)}
  .vitals .who .role{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase}
  .meters{display:flex;gap:16px;flex-wrap:wrap;flex:1;min-width:180px}
  .meter{flex:1;min-width:110px}
  .meter .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ash);margin-bottom:4px}
  .bar{height:8px;background:#0b0807;border:1px solid var(--line-soft);overflow:hidden}
  .bar > i{display:block;height:100%;transition:width .5s ease}
  .bar.hp > i{background:linear-gradient(90deg,var(--crimson),var(--crimson-lit))}
  .bar.moral > i{background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
  .bar.lib > i{background:linear-gradient(90deg,#2f6f57,var(--plague))}

  /* ---------- Tarjetas / paneles ---------- */
  .card{background:linear-gradient(180deg,var(--panel),#120d0b);border:1px solid var(--line);position:relative}
  .card::before{content:"";position:absolute;top:6px;left:6px;right:6px;bottom:6px;border:1px solid var(--line-soft);pointer-events:none;opacity:.5}
  .pad{padding:20px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  section.view{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:var(--gold-dim);margin-bottom:6px}
  h2.title{font-size:clamp(20px,3.4vw,30px);color:var(--parch);margin-bottom:4px}
  p.lede{color:var(--parch-dim);font-size:15px;max-width:64ch}
  hr.rule{border:0;border-top:1px solid var(--line-soft);margin:22px 0}

  /* ---------- Botones ---------- */
  .btn{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;
    background:#0b0807;color:var(--parch);border:1px solid var(--line);padding:12px 16px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--gold-dim);color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim) inset}
  .btn.primary{background:linear-gradient(180deg,#3a2c14,#241a0d);border-color:var(--gold-dim);color:var(--gold)}
  .btn.primary:hover{box-shadow:0 0 18px -6px var(--gold)}
  .btn.danger:hover{border-color:var(--crimson);color:var(--crimson-lit);box-shadow:0 0 0 1px var(--crimson) inset}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}

  /* ---------- Selección (razas/reinos/trasfondo) ---------- */
  .pick{display:grid;gap:12px}
  .opt{border:1px solid var(--line);background:var(--panel);padding:14px 15px;cursor:pointer;transition:.15s;position:relative}
  .opt:hover{border-color:var(--gold-dim);background:var(--panel-2)}
  .opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 24px -12px var(--gold)}
  .opt[aria-pressed="true"]::after{content:"◆";position:absolute;top:10px;right:12px;color:var(--gold);font-size:12px}
  .opt .nm{font-family:var(--display);font-weight:700;font-size:16px;color:var(--parch);display:flex;align-items:center;gap:8px}
  .opt .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ash);text-transform:uppercase}
  .opt .desc{font-size:13.5px;color:var(--parch-dim);margin-top:5px}
  .opt .stats{font-family:var(--mono);font-size:11.5px;color:var(--gold-dim);margin-top:7px;letter-spacing:.03em}

  /* ---------- Asignación de puntos ---------- */
  .statrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .statrow .nm{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--parch-dim)}
  .statctl{display:flex;align-items:center;gap:10px;font-family:var(--mono)}
  .statctl button{width:26px;height:26px;background:#0b0807;border:1px solid var(--line);color:var(--gold);cursor:pointer;font-size:15px;line-height:1}
  .statctl button:disabled{opacity:.3;cursor:not-allowed}
  .statctl .val{width:30px;text-align:center;font-size:16px;color:var(--parch)}
  .statctl .mod{color:var(--ash);font-size:12px;width:34px}

  input.field{width:100%;background:#0b0807;border:1px solid var(--line);color:var(--parch);
    font-family:var(--mono);font-size:15px;padding:12px 14px;letter-spacing:.04em}
  input.field:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 1px var(--gold-dim) inset}

  /* ---------- Mapa del frente ---------- */
  .sectors{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .sector{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#0e0a09);padding:14px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .sector:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
  .sector .nm{font-family:var(--display);font-weight:700;font-size:15px}
  .sector .co{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase}
  .sector .thr{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;margin:8px 0 6px}
  .sector.lost{opacity:.72;filter:saturate(.5)}
  .sector.lost::after{content:"CAÍDO";position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--crimson-lit)}
  .sector.liber::after{content:"LIBERADO";position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--plague)}
  .ctlbar{height:6px;background:#2a1210;border:1px solid var(--line-soft);overflow:hidden}
  .ctlbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}

  /* ---------- Misión ---------- */
  .scene{font-family:var(--serif);font-size:16.5px;color:var(--parch);line-height:1.7}
  .scene .drop::first-letter{}
  .choices{display:grid;gap:10px;margin-top:18px}
  .choice{text-align:left;background:var(--panel);border:1px solid var(--line);padding:13px 15px;cursor:pointer;transition:.15s;font-family:var(--serif);color:var(--parch);font-size:15px}
  .choice:hover{border-color:var(--gold-dim);background:var(--panel-2)}
  .choice .req{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--gold-dim);text-transform:uppercase;margin-top:5px}
  .consq{border-left:2px solid var(--line);padding:8px 0 8px 14px;margin-top:14px;display:grid;gap:4px}
  .consq .li{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}
  .up{color:var(--ok)}.down{color:var(--bad)}.neu{color:var(--parch-dim)}

  /* Dado */
  .diebox{display:flex;align-items:center;gap:16px;margin:16px 0;padding:14px;border:1px solid var(--line);background:#0b0807}
  .die{width:62px;height:62px;flex:none;border:1px solid var(--gold-dim);background:linear-gradient(180deg,#241a0d,#120d0b);
    display:grid;place-items:center;font-family:var(--mono);font-size:26px;color:var(--gold);position:relative}
  .die.rolling{animation:shake .5s linear}
  @keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-2px,1px) rotate(-6deg)}40%{transform:translate(2px,-1px) rotate(5deg)}60%{transform:translate(-1px,2px) rotate(-3deg)}80%{transform:translate(1px,-2px) rotate(4deg)}}
  .die.crit{border-color:var(--plague);color:var(--plague);box-shadow:0 0 22px -6px var(--plague)}
  .die.fumble{border-color:var(--crimson);color:var(--crimson-lit);box-shadow:0 0 22px -6px var(--crimson)}
  .diemeta{font-family:var(--mono);font-size:13px;color:var(--parch-dim)}
  .diemeta b{color:var(--parch)}

  /* Escuadra */
  .squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .trooper{border:1px solid var(--line-soft);background:#0b0807;padding:10px 12px}
  .trooper .tn{font-family:var(--display);font-size:14px;font-weight:700}
  .trooper .tr{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ash);text-transform:uppercase}
  .trooper.dead{opacity:.5}
  .trooper.dead .tn{text-decoration:line-through;color:var(--crimson-lit)}
  .trooper .thp{height:5px;background:#2a1210;margin-top:7px;border:1px solid var(--line-soft)}
  .trooper .thp > i{display:block;height:100%;background:var(--crimson-lit)}

  /* Noticias */
  .ticker{border:1px solid var(--line);background:#0b0807;overflow:hidden;white-space:nowrap;margin-bottom:16px}
  .ticker .run{display:inline-block;padding:9px 0;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--gold);animation:scroll 34s linear infinite}
  .ticker .run span{margin:0 26px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .bulletin{border-bottom:1px solid var(--line-soft);padding:14px 0;display:grid;gap:5px}
  .bulletin .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase;display:flex;gap:12px}
  .bulletin .hl{font-family:var(--display);font-weight:700;font-size:16px;color:var(--parch)}
  .bulletin .bd{font-size:14px;color:var(--parch-dim)}
  .bulletin.war .hl{color:var(--crimson-lit)}
  .bulletin.win .hl{color:var(--plague)}
  .bulletin.decree .meta{color:var(--gold-dim)}

  /* Cicatrices / condecoraciones */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;border:1px solid var(--line);padding:5px 10px;color:var(--parch-dim)}
  .chip.scar{border-color:var(--crimson);color:var(--crimson-lit)}
  .chip.medal{border-color:var(--gold-dim);color:var(--gold)}

  .center{text-align:center}
  .muted-box{border:1px dashed var(--line);padding:26px;text-align:center;color:var(--ash);font-family:var(--mono);font-size:13px;letter-spacing:.06em}
  footer.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ash);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  /* Pantalla de muerte / victoria */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(6,4,4,.94);display:grid;place-items:center;padding:24px;animation:fade .5s}
  .overlay .box{max-width:520px;text-align:center}
  .overlay h2{font-size:34px;color:var(--crimson-lit);letter-spacing:.05em}
  .overlay.victory h2{color:var(--gold)}
  .overlay p{color:var(--parch-dim);font-size:15px;margin:14px 0 22px}

  @media(max-width:720px){
    .hud{grid-template-columns:1fr}
    .g2,.g3{grid-template-columns:1fr}
    .oath{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important}
    .ticker .run{animation:none}
  }
</style>

<canvas id="stars"></canvas>
<div class="app" id="app"></div>

<script>
/* =====================================================================
   CORONA ESTELAR — El Frente Eterno
   Motor de juego. Estado persistente en localStorage.
   ===================================================================== */

const $ = (s,el=document)=>el.querySelector(s);
const rnd = (n)=>Math.floor(Math.random()*n);
const pick = (a)=>a[rnd(a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const mod = (score)=>Math.floor((score-10)/2);
const signed=(n)=>n>=0?'+'+n:''+n;

/* ---------- Datos: Razas ---------- */
const RAZAS = {
  trono:  {nm:"Humanos del Trono", ico:"♛", tag:"Leales · versátiles",
    desc:"Nacidos bajo la Corona Eterna. Ni los más fuertes ni los más astutos, pero su fe no se quiebra.",
    mods:{fue:0,des:0,vol:2,ast:0}, hp:2, moral:12,
    trait:{nm:"Fe inquebrantable", txt:"La moral nunca baja de 15."}},
  ferro:  {nm:"Enanos de Ferro", ico:"⚒", tag:"Recios · lentos",
    desc:"Forjados en las minas de Karr-Duhn. Aguantan lo que mataría a tres hombres.",
    mods:{fue:2,des:-1,vol:1,ast:0}, hp:8, moral:4,
    trait:{nm:"Piel de mena", txt:"Reduce todo daño recibido en 2."}},
  silvano:{nm:"Silvanos de Elgar", ico:"❦", tag:"Ágiles · frágiles",
    desc:"Del bosque-mundo de Sombraverde. Rápidos, precisos y demasiado orgullosos.",
    mods:{fue:-1,des:3,vol:0,ast:1}, hp:-4, moral:2,
    trait:{nm:"Paso de sombra", txt:"Ventaja en chequeos de Destreza."}},
  coloso: {nm:"Colosos de Piedra", ico:"⛰", tag:"Titánicos · torpes",
    desc:"Sangre de gigante corre por ellos. Muros de carne que caminan al frente.",
    mods:{fue:4,des:-2,vol:1,ast:-2}, hp:12, moral:0,
    trait:{nm:"Carne de titán", txt:"+12 de Vida máxima y aguante brutal."}},
  marcado:{nm:"Los Marcados", ico:"☣", tag:"Corruptos · temidos",
    desc:"Tocados por la Plaga y aun así leales. Nadie confía en ellos; todos los necesitan.",
    mods:{fue:1,des:1,vol:0,ast:2}, hp:0, moral:-8,
    trait:{nm:"Sangre infecta", txt:"Inmune a la Plaga; ventaja contra enemigos infectados."}},
  automata:{nm:"Autómatas del Gremio", ico:"⚙", tag:"Frías · imparables",
    desc:"Almas encadenadas a cuerpos de latón por la Comunión de Hierro. No sienten miedo. Tampoco sanan.",
    mods:{fue:2,des:0,vol:3,ast:-1}, hp:4, moral:20,
    trait:{nm:"Corazón de reloj", txt:"Inmune al miedo; la moral no cae. Pero no recuperas Vida al descansar."}},
};

/* ---------- Datos: Reinos ---------- */
const REINOS = {
  solmyr:{nm:"Solmyr, la Corona Eterna", ico:"☀", tag:"Doctrina imperial",
    desc:"El corazón dorado del dominio. Sus hijos luchan por gloria y por el Trono.",
    passive:{nm:"Bendición del Trono", txt:"Ganas +50% de Gloria en cada misión."}},
  karr:{nm:"Karr-Duhn, la Forja Profunda", ico:"⛨", tag:"Doctrina de asedio",
    desc:"Ciudadelas bajo la montaña. Aquí no se rinde ni la piedra.",
    passive:{nm:"Muro viviente", txt:"Empiezas cada misión con +6 de Vida temporal (armadura)."}},
  sombraverde:{nm:"Concilio de Sombraverde", ico:"☘", tag:"Doctrina de sigilo",
    desc:"El bosque-mundo silvano. Golpean donde nadie los ve venir.",
    passive:{nm:"Ojos del bosque", txt:"Ves la dificultad exacta de cada chequeo antes de elegir."}},
  ceniza:{nm:"Los Yermos de Ceniza", ico:"✷", tag:"Doctrina fronteriza",
    desc:"Colonias quemadas en el borde del frente. Odian a la Plaga con cada fibra.",
    passive:{nm:"Furia de frontera", txt:"+2 a los chequeos contra objetivos de la Plaga."}},
  franca:{nm:"La Marca Franca", ico:"⚑", tag:"Doctrina mercenaria",
    desc:"Mercenarios libres sin más señor que el oro. Eficaces, imprevisibles.",
    passive:{nm:"Botín de guerra", txt:"Cada sector liberado rinde el doble de Gloria, pero tu escuadra es menor."}},
  comunion:{nm:"La Comunión de Hierro", ico:"⛭", tag:"Doctrina de refuerzo",
    desc:"El colectivo autómata. Donde cae uno, otro se levanta de la línea de montaje.",
    passive:{nm:"Línea de reemplazo", txt:"Una vez por misión, un compañero caído puede ser reactivado."}},
};

/* ---------- Datos: Trasfondos ---------- */
const TRASFONDOS = {
  veterano:{nm:"Veterano de la Grieta", ico:"✠", stat:"fue",
    desc:"Sobreviviste a la Grieta de Novena luna. Pocos lo hicieron.",
    bonus:{fue:2}, item:"Cicatriz de honor (+1 Moral máx.)"},
  explorador:{nm:"Explorador de vanguardia", ico:"➶", stat:"des",
    desc:"Ibas siempre por delante, marcando la muerte en el mapa.",
    bonus:{des:2}, item:"Catalejo rúnico (ves la amenaza real del sector)"},
  capellan:{nm:"Capellán de campaña", ico:"†", stat:"vol",
    desc:"Diste los últimos ritos a más soldados de los que puedes recordar.",
    bonus:{vol:2}, item:"Reliquia de la Corona (+8 Moral inicial)"},
  saboteador:{nm:"Saboteador del Gremio", ico:"⚡", stat:"ast",
    desc:"Volabas nidos de la Plaga desde dentro, en silencio.",
    bonus:{ast:2}, item:"Cargas de éter (ventaja en Sabotaje)"},
};

const STAT_NM = {fue:"Fuerza", des:"Destreza", vol:"Temple", ast:"Astucia"};

/* ---------- Mapa inicial del frente ---------- */
function freshWar(){
  return {
    sectors:[
      {id:"velo",   nm:"El Velo Carmesí", co:"SECTOR I", ctl:64, threat:"media", status:"activo"},
      {id:"osario", nm:"Osario de Vhal",  co:"SECTOR II", ctl:38, threat:"alta", status:"activo"},

let build = null;
function newBuild(){ return { name:"", raza:null, reino:null, trasfondo:null, spend:{fue:0,des:0,vol:0,ast:0}, pool:3 }; }

function baseStats(b){
  const s={fue:8,des:8,vol:8,ast:8};
  if(b.raza){const m=RAZAS[b.raza].mods;for(const k in m)s[k]+=m[k];}
  if(b.trasfondo){const bo=TRASFONDOS[b.trasfondo].bonus;for(const k in bo)s[k]+=bo[k];}
  for(const k in b.spend)s[k]+=b.spend[k];
  return s;
}

function finalizeCharacter(b){
  const s=baseStats(b);
  const raza=RAZAS[b.raza], reino=REINOS[b.reino], tras=TRASFONDOS[b.trasfondo];
  let hpMax = 22 + raza.hp + mod(s.fue)*2;
  let moral = clamp(62 + raza.moral + mod(s.vol)*2 + (b.trasfondo==="capellan"?8:0));
  // tamaño de escuadra según reino
  let squadSize = b.reino==="franca"?2:3;
  const squad=[];
  const names=["Bram","Kesh","Ylva","Doran","Mira","Torv","Sela","Rook","Fenn","Ada","Cael","Nyx"];
  const roles=["Fusilero","Zapador","Médica","Explorador","Artillero","Portaestandarte"];
  const used=new Set();
  for(let i=0;i<squadSize;i++){
    let n; do{n=pick(names);}while(used.has(n)); used.add(n);
    squad.push({name:n, role:pick(roles), hp:100, alive:true});
  }
  return {
    name:b.name.trim()||"Vindicado sin nombre",
    raza:b.raza, reino:b.reino, trasfondo:b.trasfondo,
    stats:s, hp:hpMax, hpMax, moral, glory:0, rank:"Recluta",
    scars:[], medals:[], squad,
    reactivations:(b.reino==="comunion")?1:0,
    missionsDone:0, kills:0, alive:true,
  };
}

/* =====================================================================
   Sistema de dados (d20)
   ===================================================================== */
function d20(){return 1+rnd(20);}
function rollCheck(stat, dc, {advantage=false, disadvantage=false, bonus=0}={}){
  let r1=d20(), r2=d20(), raw;
  if(advantage&&!disadvantage) raw=Math.max(r1,r2);
  else if(disadvantage&&!advantage) raw=Math.min(r1,r2);
  else raw=r1;
  const c=GAME.character;
  const m = mod(c.stats[stat]) + bonus;
  const total = raw + m;
  const crit = raw===20, fumble = raw===1;
  const success = crit ? true : fumble ? false : total>=dc;
  return {raw, m, total, dc, success, crit, fumble, adv:(advantage&&!disadvantage), dis:(disadvantage&&!advantage)};
}

/* Condiciones que dan ventaja/desventaja o bonus según raza/reino */
function checkContext(stat, tags){
  const c=GAME.character; let advantage=false, disadvantage=false, bonus=0;
  if(c.raza==="silvano"&&stat==="des") advantage=true;
  if(c.raza==="marcado"&&tags.includes("plaga")) advantage=true;
  if(c.reino==="ceniza"&&tags.includes("plaga")) bonus+=2;
  if(c.reino==="franca"&&tags.includes("sabotaje")&&c.trasfondo==="saboteador") advantage=true;
  if(c.trasfondo==="saboteador"&&tags.includes("sabotaje")) advantage=true;
  if(c.moral<25) disadvantage=true; // moral rota: manos temblorosas
  return {advantage,disadvantage,bonus};
}

function startMission(sector){
  const type=pick(Object.keys(MTYPES));
  const pool=[...SCENES];
  const scenes=[];
  const n=3+rnd(2); // 3-4 escenas + clímax
  for(let i=0;i<n && pool.length;i++){ scenes.push(pool.splice(rnd(pool.length),1)[0]); }
  GAME.mission={ sector:sector.id, type, step:0, scenes, climax:false, log:[], tempHP: (GAME.character.reino==="karr"?6:0)+(GAME.character.reino==="franca"?0:0) };
  // armadura temporal Karr-Duhn
  if(GAME.character.reino==="karr"){ GAME.character.hp=Math.min(GAME.character.hpMax+6, GAME.character.hp+6); }
  GAME.screen="mission"; GAME.tab="mision";
  save(); render();
}

/* =====================================================================
   Resolución de efectos — "el peso de cada acción"
   ===================================================================== */
function applyFx(fx, log){
  const c=GAME.character, w=GAME.war, s=w.sectors.find(x=>x.id===GAME.mission.sector);
  fx=fx||{};
  if(fx.hp){
    let dmg=fx.hp;
    if(dmg<0 && c.raza==="ferro") dmg+=2; // piel de mena
    if(dmg<0) dmg=Math.min(dmg,0);
    c.hp=Math.max(0, Math.min(c.hpMax, c.hp+dmg));
    log.push([dmg<0?"down":"up", `${dmg<0?"−":"+"}${Math.abs(dmg)} Vida  ›  ${c.hp}/${c.hpMax}`]);
  }
  if(fx.moral){
    let m=fx.moral;
    if(c.raza==="automata"&&m<0) m=0;            // corazón de reloj
    if(m){ c.moral=clamp(c.moral+m); if(c.raza==="trono")c.moral=Math.max(c.moral,15);
      log.push([m<0?"down":"up", `${m<0?"−":"+"}${Math.abs(m)} Moral  ›  ${c.moral}`]); }
  }
  if(fx.glory){
    let g=fx.glory;
    if(c.reino==="solmyr") g=Math.round(g*1.5);
    c.glory+=g; log.push(["up", `+${g} Gloria`]);
  }
  if(fx.kills){ c.kills+=fx.kills; }
  if(fx.ctl && s){ s.ctl=clamp(s.ctl+fx.ctl); log.push([fx.ctl<0?"down":"up", `${fx.ctl<0?"−":"+"}${Math.abs(fx.ctl)} Control · ${s.nm}`]); }
  if(fx.plaga){ w.plaga=clamp(w.plaga+fx.plaga); log.push([fx.plaga<0?"up":"down", `${fx.plaga<0?"−":"+"}${Math.abs(fx.plaga)} Presión de la Plaga`]); }
  if(fx.scar){
    // aplicar penalización de estadística
    const map={"Temple":"vol","Destreza":"des","Fuerza":"fue","Astucia":"ast"};
    for(const k in map){ if(fx.scar.includes(k)){ c.stats[map[k]]=Math.max(3,c.stats[map[k]]-1); } }
    c.scars.push(fx.scar);
    log.push(["down", `✖ Cicatriz permanente: ${fx.scar}`]);
  }
  if(fx.squadDeath){ killSquad(fx.squadDeath, log); }
}

function killSquad(prob, log){
  const c=GAME.character;
  const alive=c.squad.filter(t=>t.alive);
  if(!alive.length) return;
  if(Math.random()<prob){
    const victim=pick(alive);
    // reactivación Comunión de Hierro
    if(c.reactivations>0 && c.reino==="comunion"){
      c.reactivations--; log.push(["neu", `⚙ ${victim.name} habría caído — reactivado por la Línea de Reemplazo.`]); return;
    }
    victim.alive=false; victim.hp=0;
    c.moral=clamp(c.moral-6);
    log.push(["down", `☠ ${victim.name} (${victim.role}) ha caído. No volverá.`]);
  }
}

/* =====================================================================
   Flujo de misión
   ===================================================================== */
let pendingRoll=null; // {choice, scene}

function currentScene(){
  const m=GAME.mission;
  if(m.climax) return CLIMAX[m.type];
  return m.scenes[m.step];
}

function chooseOption(idx){
  const scene=currentScene();
  const choice=scene.choices[idx];
  const c=GAME.character;
  const log=[];
  if(choice.check){
    const ctx=checkContext(choice.check.stat, choice.check.tags||[]);
    const res=rollCheck(choice.check.stat, choice.check.dc, ctx);
    pendingRoll={res, choice, log};
    animateRoll(res, ()=>{
      const branch = res.success ? choice.ok : choice.no;
      log.push([res.success?"up":"down", `${res.crit?"¡CRÍTICO! ":res.fumble?"¡PIFIA! ":""}${res.success?"Éxito":"Fallo"} — ${STAT_NM[choice.check.stat]}`]);
      applyFx(branch.fx, log);
      GAME.mission.log.push({txt:branch.txt, log});
      advance();
    });
  } else {
    const branch=choice.ok;
    applyFx(branch.fx, log);
    GAME.mission.log.push({txt:branch.txt, log});
    advance();
  }
}

function advance(){
  const c=GAME.character;
  if(c.hp<=0){ save(); return heroDeath(); }
  const m=GAME.mission;
  if(m.climax){ return endMission(); }
  m.step++;
  if(m.step>=m.scenes.length){ m.climax=true; }
  save(); render();
}

function endMission(){
  const c=GAME.character, w=GAME.war;
  c.missionsDone++; w.missions++;
  c.rank=rankFor(c.glory);
  // recompensa por completar
  c.glory += 2;
  // condecoración por hitos
  awardMedals();
  const s=w.sectors.find(x=>x.id===GAME.mission.sector);
  updateSectorStatus(s);
  // deriva global de la Plaga
  w.plaga=clamp(w.plaga+ (Math.random()<.5?1:2)); // la Plaga siempre avanza un poco
  recomputeLiberation();
  generateWarNews(s);
  GAME.screen="summary";
  save(); render();
}

function awardMedals(){
  const c=GAME.character;
  const has=n=>c.medals.includes(n);
  if(c.missionsDone>=1 && !has("Primera Sangre")) c.medals.push("Primera Sangre");
  if(c.kills>=1 && !has("Matarreinas")) c.medals.push("Matarreinas");
  if(c.missionsDone>=5 && !has("Veterano del Frente")) c.medals.push("Veterano del Frente");
  if(c.squad.every(t=>t.alive) && c.missionsDone>=3 && !has("Ni un hombre atrás")) c.medals.push("Ni un hombre atrás");
  if(c.glory>=22 && !has("Corona de Hierro")) c.medals.push("Corona de Hierro");
}

function updateSectorStatus(s){
  if(!s) return;
  if(s.ctl>=100){ s.status="liberado"; }
  else if(s.ctl<=0){ s.status="caído"; }
  else s.status="activo";
  // amenaza según control
  s.threat = s.ctl>70?"baja": s.ctl>45?"media": s.ctl>25?"alta":"crítica";
}

function recomputeLiberation(){
  const w=GAME.war;
  const lib=w.sectors.filter(s=>s.status==="liberado").length;
  w.liberated=lib;
  const avg=Math.round(w.sectors.reduce((a,s)=>a+s.ctl,0)/w.sectors.length);
  w.liberationPct=avg;
}

/* =====================================================================
   Muerte del héroe — permadeath
   ===================================================================== */
function heroDeath(){
  const c=GAME.character, w=GAME.war;
  w.fallen.push({name:c.name, rank:c.rank, glory:c.glory, missions:c.missionsDone,
    raza:RAZAS[c.raza].nm, reino:REINOS[c.reino].nm});
  GAME.news.unshift({kind:"war", src:"LISTA DE HONOR", time:`CICLO ${w.missions}`,
    hl:`Cae ${c.name}, ${c.rank}`,
    bd:`Tras ${c.missionsDone} misión(es) y ${c.glory} de Gloria, ${c.name} de ${REINOS[c.reino].nm} entrega su vida al frente. La galaxia continúa sin él. La Corona busca ya a su sucesor.`});
  w.plaga=clamp(w.plaga+3);
  GAME.character=null; GAME.mission=null; GAME.screen="death";
  save(); render();
}

/* =====================================================================
   Noticias — propaganda del frente
   ===================================================================== */
const DECREES=[
 "La Corona recuerda: la duda es la primera espora de la Plaga.",
 "Un ciudadano que teme a la muerte ya está infectado de cobardía.",
 "El Trono no cuenta a sus caídos. Cuenta a sus héroes.",
 "Cada bota en el barro es un ladrillo en el muro de la Corona.",
 "Rendirse es un lujo que el frente no puede permitirse.",
];
function generateWarNews(s){
  const w=GAME.war, c=GAME.character;
  const time=`CICLO ${w.missions}`;
  if(s && s.status==="liberado"){
    GAME.news.unshift({kind:"win", src:`FRENTE · ${s.co}`, time,
      hl:`¡${s.nm} LIBERADO!`, bd:`El estandarte de la Corona ondea de nuevo sobre ${s.nm}. ${c?c.name:"Un Vindicado"} entra en las crónicas del Trono.`});
  } else if(s && s.status==="caído"){
    GAME.news.unshift({kind:"war", src:`FRENTE · ${s.co}`, time,
      hl:`${s.nm} ha caído`, bd:`El control imperial se desploma. La Plaga reclama ${s.nm}. Se ordena repliegue y contraataque.`});
  } else if(s){
    const dir = s.ctl>=55?"avanza":"resiste a duras penas";
    GAME.news.unshift({kind:"decree", src:`PARTE DE GUERRA`, time,
      hl:`El frente ${dir} en ${s.nm}`, bd:`Control imperial al ${s.ctl}%. ${c?c.name+" ":""}reporta ${c?c.kills:0} objetivo(s) de la Plaga abatido(s). Presión de la Plaga: ${w.plaga}%.`});
  }
  if(Math.random()<.6){
    GAME.news.unshift({kind:"decree", src:"EDICTO DEL TRONO", time, hl:pick(DECREES), bd:"— Transmitido por orden de la Corona Eterna a todos los sectores."});
  }
  if(GAME.news.length>40) GAME.news.length=40;
}

/* =====================================================================
   Animación del dado
   ===================================================================== */
function animateRoll(res, done){
  GAME.screen="rolling"; render();
  const el=$("#die"); if(!el){ done(); return; }
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reduce){ el.textContent=res.raw; done(); setTimeout(()=>{},0); return; }
  el.classList.add("rolling");
  let ticks=0;
  const iv=setInterval(()=>{
    el.textContent=1+rnd(20); ticks++;
    if(ticks>12){
      clearInterval(iv);
      el.textContent=res.raw;
      el.classList.remove("rolling");
      if(res.crit) el.classList.add("crit");
      if(res.fumble) el.classList.add("fumble");
      const meta=$("#diemeta");
      if(meta) meta.innerHTML=`Tirada <b>${res.raw}</b> ${signed(res.m)} = <b>${res.total}</b> vs DC <b>${res.dc}</b> · <span class="${res.success?'up':'down'}">${res.success?"ÉXITO":"FALLO"}</span>`;
      setTimeout(done, 850);
    }
  }, 55);
}

    <hr class="rule">
    <div class="grid g3" style="text-align:left">
      ${statBox("Gloria total", c.glory, "gold")}
      ${statBox("Control del sector", s.ctl+"%", "")}
      ${statBox("Presión de la Plaga", w.plaga+"%", "crimson")}
    </div>
    ${dead.length?`<div class="muted-box" style="margin-top:18px;color:var(--crimson-lit)">Caídos en esta misión: ${dead.map(d=>d.name).join(", ")}. No volverán.</div>`:`<div class="muted-box" style="margin-top:18px;color:var(--ok)">Toda tu escuadra regresó con vida. Raro. Precioso.</div>`}
    ${c.rank!=="Recluta"?`<p class="label" style="margin-top:14px">Rango actual: <span class="gold">${c.rank}</span></p>`:''}
    <div class="btnrow" style="justify-content:center;margin-top:22px">
      <button class="btn" onclick="go('noticias')">Leer los partes ▸</button>
      <button class="btn primary" onclick="go('frente')">Volver al frente ▸</button>
    </div>
  </div></section>`;
}
function statBox(l,v,c){return `<div class="card pad"><div class="label">${l}</div><div class="${c}" style="font-family:var(--display);font-size:28px;font-weight:700;margin-top:4px">${v}</div></div>`;}

  return `<section class="view">
    <div class="eyebrow">Expediente del Vindicado</div>
    <h2 class="title">${esc(c.name)}</h2>
    <p class="lede">${r.nm} · ${k.nm} · ${tr.nm}</p>
    <hr class="rule">
    <div class="grid g2">
      <div class="card pad">
        <div class="label" style="margin-bottom:10px">Atributos</div>
        ${['fue','des','vol','ast'].map(kk=>`<div class="statrow"><div class="nm">${STAT_NM[kk]}</div>
          <div class="statctl"><div class="val">${c.stats[kk]}</div><div class="mod">(${signed(mod(c.stats[kk]))})</div></div></div>`).join("")}
        <div style="margin-top:14px" class="label">Rango</div>
        <div class="gold" style="font-family:var(--display);font-size:18px">${c.rank}</div>
      </div>
      <div class="card pad">
        <div class="label" style="margin-bottom:8px">Don de linaje</div>
        <div style="font-family:var(--display);color:var(--gold)">${r.trait.nm}</div>
        <p style="font-size:13.5px;color:var(--parch-dim);margin:4px 0 14px">${r.trait.txt}</p>
        <div class="label" style="margin-bottom:8px">Doctrina de reino</div>
        <div style="font-family:var(--display);color:var(--gold)">${k.passive.nm}</div>
        <p style="font-size:13.5px;color:var(--parch-dim);margin:4px 0 0">${k.passive.txt}</p>
      </div>
    </div>
    <hr class="rule">
    <div class="grid g2">
      <div class="card pad">
        <div class="label" style="margin-bottom:10px">Cicatrices (${c.scars.length})</div>
        ${c.scars.length?`<div class="chips">${c.scars.map(s=>`<span class="chip scar">✖ ${s}</span>`).join("")}</div>`:`<p class="dim mono" style="font-size:12px">Ninguna todavía. Espera.</p>`}
        <div class="label" style="margin:16px 0 10px">Condecoraciones (${c.medals.length})</div>
        ${c.medals.length?`<div class="chips">${c.medals.map(m=>`<span class="chip medal">✦ ${m}</span>`).join("")}</div>`:`<p class="dim mono" style="font-size:12px">Aún sin honores.</p>`}
      </div>
      <div class="card pad">
        <div class="label" style="margin-bottom:10px">Escuadra</div>
        <div class="squad">${c.squad.map(t=>`<div class="trooper ${t.alive?'':'dead'}">
          <div class="tn">${t.name}</div><div class="tr">${t.alive?t.role:'Caído'}</div>
          <div class="thp"><i style="width:${t.alive?t.hp:0}%"></i></div></div>`).join("")}</div>
        <p class="label" style="margin-top:12px">Misiones: <span class="gold">${c.missionsDone}</span> · Objetivos abatidos: <span class="crimson">${c.kills}</span></p>
      </div>
    </div>
  </section>`;
}

/* ----- Razas / Reinos (enciclopedia) ----- */

    <div class="eyebrow">Códice de linajes</div><h2 class="title">Las Razas del Frente</h2>
    <p class="lede">Seis pueblos sangran por la Corona. Cada uno paga con una moneda distinta.</p><hr class="rule">
    <div class="grid g2">${Object.values(RAZAS).map(r=>`<div class="card pad">
      <div style="display:flex;align-items:center;gap:10px"><div class="avatar">${r.ico}</div>
        <div><div style="font-family:var(--display);font-weight:700;font-size:17px">${r.nm}</div><div class="label">${r.tag}</div></div></div>
      <p style="font-size:14px;color:var(--parch-dim);margin:12px 0 8px">${r.desc}</p>
      <div class="stats mono" style="color:var(--gold-dim);font-size:12px">${statLine(r.mods,r.hp,r.moral)}</div>

        <div><div style="font-family:var(--display);font-weight:700;font-size:17px">${r.nm}</div><div class="label">${r.tag}</div></div></div>

/* ----- Noticias ----- */
function viewNoticias(){
  const w=GAME.war;
  const ticker=[...DECREES, `Presión de la Plaga: ${w.plaga}%`, `Héroes caídos: ${w.fallen.length}`, `Sectores liberados: ${w.liberated}`];
  return `<section class="view">
    <div class="ticker"><div class="run">${ticker.concat(ticker).map(t=>`<span>◆ ${t}</span>`).join("")}</div></div>
    <div class="eyebrow">Crónica del frente</div><h2 class="title">Noticias de la Corona</h2>
    <p class="lede">Partes de guerra, edictos del Trono y la lista de honor. La verdad, tal como la Corona la cuenta.</p><hr class="rule">
    ${w.fallen.length?`<div class="card pad" style="margin-bottom:16px">
      <div class="label" style="color:var(--crimson-lit);margin-bottom:8px">▚ Lista de honor — caídos que no volverán</div>
      <div class="chips">${w.fallen.map(f=>`<span class="chip scar">☠ ${esc(f.name)} · ${f.rank} · ${f.missions} mis.</span>`).join("")}</div>
    </div>`:''}
    ${GAME.news.map(n=>`<div class="bulletin ${n.kind}">
      <div class="meta"><span>${n.src}</span><span>${n.time}</span></div>
      <div class="hl">${n.hl}</div><div class="bd">${n.bd}</div></div>`).join("")}

}

/* ----- Overlays ----- */
function viewDeath(){
  const last=GAME.war.fallen[GAME.war.fallen.length-1];
  return `<div class="overlay" onclick="event.stopPropagation()">
    <div class="box">
      <div class="eyebrow" style="color:var(--crimson)">La lista de honor se alarga</div>
      <h2>${last?esc(last.name):"Un Vindicado"} ha caído</h2>
      <p>${last?`${last.rank} de ${last.reino}. ${last.missions} misión(es), ${last.glory} de Gloria.`:''} La muerte en el frente es permanente. Pero la galaxia no se detiene por un solo héroe — la Plaga avanza, y la Corona ya llama al siguiente.</p>
      <div class="btnrow" style="justify-content:center">
        <button class="btn primary" onclick="GAME.screen='intro';GAME.tab='frente';render()">Alistar un nuevo Vindicado ▸</button>
      </div>
    </div>
  </div>${shell(viewNoticias(),true)}`;
}

/* ---------- Navegación ---------- */
function go(tab){
  GAME.tab=tab;
  if(GAME.character){ GAME.screen="game"; }
  else if(tab==="razas"||tab==="reinos"){ GAME.screen="codex"; }
  save(); render();
}

/* ---------- Shell + montaje ---------- */
function bodyForTab(){
  if(!GAME.character){
    if(GAME.tab==="razas") return viewRazas();
    if(GAME.tab==="reinos") return viewReinos();
    return viewIntro();
  }
  switch(GAME.tab){
    case "frente": return viewFrente();
    case "personaje": return viewPersonaje();
    case "noticias": return viewNoticias();
    case "razas": return viewRazas();
    case "reinos": return viewReinos();
    default: return viewFrente();
  }
}
function shell(inner, noHud){
  return header()+tabs()+((GAME.character&&!noHud)?hud():'')+inner+
   `<footer class="foot"><span>CORONA ESTELAR · EL FRENTE ETERNO</span><span>Ciclo ${GAME.war.missions} · Plaga ${GAME.war.plaga}% · Caídos ${GAME.war.fallen.length}</span></footer>`;
}

function render(){
  let inner;
  switch(GAME.screen){
    case "intro": inner=shell(GAME.tab==="razas"?viewRazas():GAME.tab==="reinos"?viewReinos():viewIntro()); break;
    case "create": inner=header()+tabs()+viewCreate(); break;
    case "briefing": inner=shell(viewBriefing()); break;
    case "mission": inner=shell(viewMission()); break;
    case "rolling": inner=shell(viewRolling()); break;
    case "summary": inner=shell(viewSummary()); break;
    case "death": app.innerHTML=viewDeath(); return;
    case "codex": inner=shell(bodyForTab()); break;
    case "game": default: inner=shell(bodyForTab()); break;
  }
  app.innerHTML=inner;
  // reponer foco de nombre si estamos creando
  if(GAME.screen==="create"){ const f=$("#nameF"); /* no autofocus para no robar scroll */ }
}

/* ---------- Fondo de brasas/estrellas ---------- */
(function starfield(){
  const cv=$("#stars"), ctx=cv.getContext("2d");
  let w,h,stars,embers;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function size(){ w=cv.width=innerWidth; h=cv.height=innerHeight;
    stars=Array.from({length:90},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.2,t:Math.random()*6.28}));
    embers=Array.from({length:reduce?0:28},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*.4+.15,r:Math.random()*1.6+.4}));
  }
  size(); addEventListener("resize",size);
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){ s.t+=0.02; const a=.35+Math.sin(s.t)*.25;
      ctx.fillStyle=`rgba(201,162,75,${a*.5})`; ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill(); }
    for(const e of embers){ e.y-=e.s; if(e.y<-4){e.y=h+4;e.x=Math.random()*w;}
      ctx.fillStyle="rgba(179,49,43,.5)"; ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.3);ctx.fill(); }
    if(!reduce) requestAnimationFrame(frame);
  }
  if(reduce){ // dibujar un frame estático
    ctx.clearRect(0,0,w,h);
    for(const s of stars){ctx.fillStyle="rgba(201,162,75,.3)";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill();}
  } else frame();
})();

render();
</script>
